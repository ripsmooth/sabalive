<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salibandy · Lower Third</title><style>

:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1;--gfx-width:1400px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.gfx{opacity:1;transition:opacity .45s ease-in-out;will-change:opacity;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
body.gfx-hidden .gfx{opacity:0;pointer-events:none}
.hidden{display:none!important}
.err{position:fixed;left:8px;bottom:8px;background:rgba(16,24,32,.96);border-left:4px solid var(--accent);padding:10px 14px;color:#fff;font-size:14px;max-width:calc(100vw - 16px)}
.logo{object-fit:contain;display:block}
.fallback{display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-weight:900;background:var(--ink);flex:0 0 auto}

.stage{position:absolute;bottom:50px;left:8px;width:var(--gfx-width);max-width:calc(100vw - 16px);transform:scale(var(--scale));transform-origin:bottom left}
.hero{height:170px;display:grid;grid-template-columns:minmax(0,1fr) 300px minmax(0,1fr);background:var(--accent);align-items:stretch}
.team{background:rgba(16,24,32,.98);display:flex;align-items:center;gap:24px;padding:22px 32px;min-width:0}
.team.b{flex-direction:row-reverse;text-align:right}
.logo{width:100px;height:100px;flex:0 0 100px}
.fallback{width:100px;height:100px;font-size:28px}
.teamname{font-size:clamp(24px,2.5vw,42px);font-weight:900;text-transform:uppercase;line-height:1.05;overflow-wrap:anywhere}
.center{color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 8px;text-align:center}
.score{font-size:58px;font-weight:900;line-height:1}
.clock{font-size:25px;font-weight:900;margin-top:9px}
.status{font-size:16px;font-weight:900;letter-spacing:.12em;margin-top:8px;text-transform:uppercase}
.lists{display:grid;grid-template-columns:1fr 1fr;border-top:5px solid var(--accent);background:rgba(16,24,32,.98)}
.goalcol{min-width:0;padding:15px 25px 18px}
.goalcol.b{border-left:1px solid #43505a}
.coltitle{font-size:18px;letter-spacing:.1em;font-weight:900;color:var(--accent);text-transform:uppercase;margin-bottom:8px}
.goalrow{display:flex;gap:16px;align-items:baseline;min-height:32px;font-size:21px;line-height:1.25}
.goaltimes{flex:0 0 auto;color:var(--accent);font-weight:900;white-space:nowrap}
.goalname{font-weight:800;min-width:0;overflow-wrap:anywhere}
.goalnum{margin-left:auto;color:var(--muted);font-size:15px;white-space:nowrap}
.no-goals{font-size:18px;color:var(--muted);padding:3px 0}
@media(max-width:850px){.hero{height:110px;grid-template-columns:minmax(0,1fr) 140px minmax(0,1fr)}.team{gap:10px;padding:10px}.logo,.fallback{width:54px;height:54px;flex-basis:54px}.teamname{font-size:clamp(15px,2.5vw,24px)}.score{font-size:34px}.clock{font-size:16px}.status{font-size:11px}.goalcol{padding:10px}.coltitle{font-size:12px}.goalrow{font-size:14px;gap:7px;min-height:25px}.goalnum{font-size:10px}}
</style></head><body><div class="gfx stage">
<div class="hero"><div class="team"><div id="logoA" class="fallback">A</div><div id="teamAName" class="teamname">KOTI</div></div>
<div class="center"><div id="score" class="score">0 – 0</div><div id="clock" class="clock"></div><div id="status" class="status">OTTELU</div></div>
<div class="team b"><div id="logoB" class="fallback">B</div><div id="teamBName" class="teamname">VIERAS</div></div></div>
<div class="lists"><div class="goalcol"><div class="coltitle" id="titleA">KOTI · MAALIT</div><div id="goalsA"></div></div><div class="goalcol b"><div class="coltitle" id="titleB">VIERAS · MAALIT</div><div id="goalsB"></div></div></div>
</div><div id="error" class="err hidden"></div>
<script>
const q=new URLSearchParams(location.search);
const matchId=q.get('match_id')||q.get('ottelu')||'953141';
const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||3)));
const scale=Math.max(.5,Math.min(2.5,Number(q.get('scale')||1)));
const width=Math.max(500,Math.min(1920,Number(q.get('width')||1400)));
document.documentElement.style.setProperty('--scale',scale);
document.documentElement.style.setProperty('--gfx-width',width+'px');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function getMatch(){const u=new URL('/api/salibandy-match',location.origin);u.searchParams.set('match_id',matchId);u.searchParams.set('timeStamp',Date.now());return fetch(u,{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d?.error||('API vastasi '+r.status));if(d.call?.status&&d.call.status!=='ok')throw Error('TorneoPal: '+d.call.status);if(!d.match)throw Error('Ottelutietoja ei löytynyt.');return d.match})}
function setText(id,value){const e=$(id);if(e)e.textContent=value??''}
function setLogo(id,url,name){const e=$(id);if(!e)return;e.innerHTML='';if(url&&/^https?:\/\//i.test(url)){const im=document.createElement('img');im.className='logo';im.src=url;im.alt='';im.onerror=()=>fallback();e.className='';e.appendChild(im);function fallback(){e.className='fallback';e.textContent=(name||'?').slice(0,2).toUpperCase()}}else{e.className='fallback';e.textContent=(name||'?').slice(0,2).toUpperCase()}}
function teamFields(m){return {a:{id:String(m.team_A_id||''),name:m.team_A_name||m.club_A_name||'KOTI',logo:m.club_A_crest||m.team_A_crest||''},b:{id:String(m.team_B_id||''),name:m.team_B_name||m.club_B_name||'VIERAS',logo:m.club_B_crest||m.team_B_crest||''}}}
function getScore(m){return {a:m.live_A??m.fs_A??'0',b:m.live_B??m.fs_B??'0'}}
function matchClock(m){const status=String(m.status||'').toLowerCase();if(['played','finished','over'].includes(status))return 'LOPPUTULOS';if(m.live_time_mmss)return String(m.live_time_mmss);if(m.live_time)return String(m.live_time);return m.time?String(m.time).slice(0,5):''}
async function updateVisibility(key,defaultVisible){try{const r=await fetch('/api/salibandy-graphics-state',{cache:'no-store'});if(!r.ok)return;const d=await r.json();document.body.classList.toggle('gfx-hidden',d[key]!==true)}catch(e){/* retain default visibility if remote control is unreachable */}}
function startVisibility(key,defaultVisible){const remote=new URLSearchParams(location.search).get('remote')==='1';if(!remote){document.body.classList.remove('gfx-hidden');return}if(!defaultVisible)document.body.classList.add('gfx-hidden');updateVisibility(key,defaultVisible);setInterval(()=>updateVisibility(key,defaultVisible),2000)}
function showError(err){const e=$('error');if(e){e.textContent='Salibandy: '+(err?.message||err);e.classList.remove('hidden')}}
function clearError(){const e=$('error');if(e)e.classList.add('hidden')}

function minute(g){let x=String(g.time_min||'').trim();if(!x)x=String(g.time||'').split(':')[0];return x.replace(/'$/,'')+"'";}
function drawGoals(el,goals){const byPlayer=new Map();for(const g of goals){const name=g.player_name||'Tuntematon maalintekijä';const key=String(g.team_id)+'|'+name+'|'+String(g.player_shirt_number||'');if(!byPlayer.has(key))byPlayer.set(key,{name,number:g.player_shirt_number||'',times:[]});byPlayer.get(key).times.push(minute(g))}const list=[...byPlayer.values()];el.innerHTML=list.length?list.map(p=>'<div class="goalrow"><span class="goaltimes">'+esc(p.times.join(', '))+'</span><span class="goalname">'+esc(p.name)+'</span>'+(p.number?'<span class="goalnum">#'+esc(p.number)+'</span>':'')+'</div>').join(''):'<div class="no-goals">Ei maaleja</div>'}
async function update(){try{const m=await getMatch(),t=teamFields(m),sc=getScore(m);setLogo('logoA',t.a.logo,t.a.name);setLogo('logoB',t.b.logo,t.b.name);setText('teamAName',t.a.name);setText('teamBName',t.b.name);setText('titleA',t.a.name+' · MAALIT');setText('titleB',t.b.name+' · MAALIT');setText('score',sc.a+' – '+sc.b);setText('clock',String(m.status||'').toLowerCase()==='played'?'':matchClock(m));setText('status',String(m.status||'').toLowerCase()==='played'?'LOPPUTULOS':(m.competition_name||'SALIBANDY'));const goals=Array.isArray(m.goals)?m.goals:[];drawGoals($('goalsA'),goals.filter(g=>String(g.team_id)===t.a.id));drawGoals($('goalsB'),goals.filter(g=>String(g.team_id)===t.b.id));clearError()}catch(e){showError(e)}}
startVisibility('lowerthird',false);update();setInterval(update,refresh*1000);
</script></body></html>

const refresh=Math.max(3,Math.min(30,Number(q.get('refresh')||5)));

const txt=(n,t)=>n.getElementsByTagName(t)[0]?.textContent?.trim()||'', attr=(n,a)=>String(n.getAttribute(a)||'').trim();

function status(m){
 const live=(txt(m,'livestatus')||'').trim().toLowerCase();

function clock(m){const p=Math.max(1,+txt(m,'livejakso')||1),len=Math.max(1,+txt(m,'eramin')||45),raw=txt(m,'liveaika')||txt(m,'livekokaika');let s=seconds(raw);if(!Number.isFinite(s))return '';const done=(p-1)*len*60;if(p>1&&s<done)s+=done;return Math.ceil(s/60)+"'"}

function penaltyMinutes(type){const m=String(type||'').match(/^(3|5|6|10)min$/);return m?Number(m[1]):0}

function goalEventTitle(e){const suffix=goalSpecialSuffix(e);if(suffix==='kl')return 'Maali (kulmalyönti)';if(suffix==='rl'&&e.type==='maali')return 'Maali (rangaistuslyönti)';if(suffix==='rl'&&e.type==='ohi')return 'Epäonnistunut rangaistuslyönti';return classify(e)}

function eventItems(m){const items=[...m.getElementsByTagName('tapahtuma')].map(e=>{const rawType=attr(e,'tapahtuma')||attr(e,'tyyppi')||txt(e,'tapahtuma')||txt(e,'tyyppi'),detail=attr(e,'selite')||attr(e,'kuvaus')||txt(e,'selite')||txt(e,'kuvaus')||'',type=normalizeEventType(rawType,detail,e),tm=minute(e,m),sec=seconds(attr(e,'kulunutaika')||attr(e,'peliaika')||attr(e,'aika'));const attrs=[...e.attributes].map(a=>a.name+'='+a.value).sort().join('|');const childText=String(e.textContent||'').replace(/\s+/g,' ').trim();return {node:e,type,tm,sec:Number.isFinite(sec)?sec:0,team:attr(e,'kvjoukkue')||'',player:attr(e,'pelaajanimi')||[attr(e,'etunimi'),attr(e,'sukunimi')].filter(Boolean).join(' '),detail,key:[attrs,childText?'text='+childText:''].filter(Boolean).join('|')||[type,tm,attr(e,'joukkue'),attr(e,'pelaajanimi'),detail].join('|')}}).sort((a,b)=>a.sec-b.sec);let home=Number.parseInt(txt(m,'kmaali'),10),away=Number.parseInt(txt(m,'vmaali'),10);if(Number.isFinite(home)&&Number.isFinite(away)){let uncertain=false;for(let i=items.length-1;i>=0;i--){const e=items[i];if(e.type!=='maali')continue;const side=eventSide(e,m);if(!side){uncertain=true;continue}if(!uncertain)e.scoreAfter=home+'–'+away;if(side==='home')home=Math.max(0,home-1);else away=Math.max(0,away-1)}}else{home=0;away=0;for(const e of items){if(e.type!=='maali')continue;const side=eventSide(e,m);if(side==='home')home++;else if(side==='away')away++;else continue;e.scoreAfter=home+'–'+away}}return items}
function attendanceCount(m){

  const av=Number.isFinite(a.id)&&a.id>0,bv=Number.isFinite(b.id)&&b.id>0;

}
function matchId(m){return txt(m,'otteluid')||[txt(m,'kotinimi'),txt(m,'vierasnimi')].join('|')}
function processEventChanges(matches){const now=Date.now();if(eventBaselineDate!==date){eventKeysByMatch.clear();newEventUntil.clear();newEventFlashUntil.clear();newGoalUntil.clear();eventBaselineDate=date;for(const m of matches)eventKeysByMatch.set(matchId(m),new Set(eventItems(m).map(e=>e.key)));return}

 for(const [key,until] of newEventUntil)if(until<=now)newEventUntil.delete(key);for(const [key,until] of newEventFlashUntil)if(until<=now)newEventFlashUntil.delete(key);for(const [key,until] of newGoalUntil)if(until<=now)newGoalUntil.delete(key)}
function eventIsNew(m,e){return (newEventUntil.get(matchId(m)+'|'+e.key)||0)>Date.now()}
function eventJustArrived(m,e){return (newEventFlashUntil.get(matchId(m)+'|'+e.key)||0)>Date.now()}

function classify(e){if(e.type==='aikalisa')return 'Aikalisä';if(e.type==='maali')return 'Maali';if(e.type==='laukaus')return 'Laukaus kohti maalia';if(e.type==='laukausohi'||e.type==='ohi')return 'Laukaus ohi';if(e.type==='kulma')return 'Kulmalyönti';const mins=penaltyMinutes(e.type);if(mins)return mins+' minuutin rangaistus';if(e.type==='ulosajo')return 'Ulosajo';if(e.type==='rangaistus')return 'Rangaistus';return e.type.replace(/[_-]/g,' ')||'Tapahtuma'}

function validClock(value){
 const raw=String(value||'').trim();
 const match=raw.match(/(?:^|[T ])(\d{1,2}):(\d{2})(?::\d{2})?/);
 if(!match)return '';

 if(!Number.isInteger(h)||!Number.isInteger(min)||h<0||h>23||min<0||min>59)return '';

}
function kickoff(m){
 // kellokayntiin on toteutunut alkamisaika. Hylkää TorneoPalin nollattu päivämäärä.
 const actual=String(txt(m,'kellokayntiin')||attr(m,'kellokayntiin')||'').trim();
 if(actual && !/^0000-00-00(?:\b|T)/.test(actual)){
  const actualClock=validClock(actual);if(actualClock)return actualClock;

}
const SCHEDULE_RETRY_MS=30000;
const scheduleAttemptedAt=new Map();
function normTeam(s){return String(s||'').normalize('NFKC').toLocaleLowerCase('fi-FI').replace(/[\s\u00a0]+/g,' ').replace(/\s*([/–-])\s*/g,'$1').trim()}
function liveSeriesFor(m){return normTeam(txt(m,'sarjatunnus')||txt(m,'sarja')||attr(m,'sarja')||txt(m,'sarjaid')||txt(m,'sarjanimi')||'')}
function scheduleRowFromData(m,data){
 const rows=Array.isArray(data?.matches)?data.matches:[],id=txt(m,'otteluid');
 // Match ID is authoritative. Never let another age group's same-named clubs steal this fixture.
 if(id){const exact=rows.find(x=>String(x.id)===String(id));if(exact)return exact}

  const sameSeries=candidates.filter(x=>[x.sarja,x.sarjanimi,x.sarjaNimi,x.seriesName].some(v=>normTeam(v)===series));

}
function mergeScheduleData(previous,incoming){

  const id=String(row.id),old=byId.get(id);

}
function scheduleDataComplete(data,liveMatches){if(!data||!Array.isArray(data.matches)||data._scheduleError||data.complete===false||(Array.isArray(data.failedSeries)&&data.failedSeries.length))return false;if(!liveMatches?.length)return true;return liveMatches.every(m=>{const row=scheduleRowFromData(m,data);if(!row)return false;const code=String(row.sarja||'').trim(),label=String(row.sarjanimi||row.sarjaNimi||row.seriesName||'').trim(),time=String(row.klo||kickoff(m)||'').trim();return Boolean((code||label)&&time)})}
async function ensureSchedule(targetDate,liveMatches=[]){

  const u=new URL('/api/schedule',location.origin);u.searchParams.set('pvm',targetDate);u.searchParams.set('turnaus',tournament);

async function loadMatchRoster(id,m){

 const task=(async()=>{try{const u=new URL('/api/match',location.origin);u.searchParams.set('ottelu',id);const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('Ottelun kokoonpanohaku vastasi HTTP '+r.status+'.');const html=await r.text();const roster=parseMatchRoster(html,txt(m,'kotinimi'),txt(m,'vierasnimi'));rosterCache.set(id,roster)}catch(error){rosterCache.set(id,{home:[],away:[],error:error?.message||'Kokoonpanojen haku epäonnistui.'})}finally{rosterPending.delete(id);if(selectedId===id){const doc=new DOMParser().parseFromString(latestXml,'application/xml');const current=[...doc.getElementsByTagName('ottelu')].find(x=>txt(x,'otteluid')===id);if(current)renderLineups(current)}}})();rosterPending.set(id,task);return task;
}
function halfTimeScore(m){
 const duration=Math.max(1,Number(txt(m,'eramin'))||45)*60;
 const goals=eventItems(m).filter(e=>e.type==='maali'&&!isRpkEvent(e));
 let home=0,away=0,known=0;
 for(const e of goals){
  const period=Number(attr(e.node,'jakso')||0);
  const inFirstHalf=period>0?period===1:(Number.isFinite(e.sec)&&e.sec<=duration);
  if(!inFirstHalf)continue;
  const side=eventSide(e,m);
  if(side==='home'){home++;known++}
  else if(side==='away'){away++;known++}
 }
 return known?`${home}–${away}`:'0–0';
}
function firstHalfCompleted(m,st=status(m)){
 const period=Number(txt(m,'livejakso')||0);
 // TorneoPal vahvistaa ensimmäisen puoliajan päättymisen taukotilalla
 // (status=Break) tai ilmoittamalla toisen jakson alkaneeksi.
 return st.phase==='paused'||period>=2||['recentFinished','finished'].includes(st.phase);
}
function renderDetail(m){const home=txt(m,'kotinimi')||'Koti',away=txt(m,'vierasnimi')||'Vieras',st=status(m),hs=txt(m,'kmaali')||'–',as=txt(m,'vmaali')||'–',allEv=eventItems(m),ev=allEv.filter(e=>isDisplayEvent(e)&&!isRpkEvent(e)),flash=goalJustHappened(m);$('detailHeader').innerHTML=`<div class="detail-head ${flash?'goal-flash':''}"><div class="detail-score"><div class="detail-team">${txt(m,'kotilogo')&&/^https?:\/\//i.test(txt(m,'kotilogo'))?`<img class="detail-team-logo" src="${esc(txt(m,'kotilogo'))}" alt="${esc(home)}" onerror="this.remove()">`:''}${esc(home)}</div><div><div class="detail-result ${flash?'goal-flash':''}">${esc(hs)}–${esc(as)}</div>${firstHalfCompleted(m,st)?`<div class="detail-clock detail-halftime-line">(${esc(halfTimeScore(m))})</div>`:``}<div class="detail-clock">${st.phase==='live'?esc(clock(m)||'LIVE'):st.phase==='paused'?'TAUKO':['recentFinished','finished'].includes(st.phase)?'LOPPUTULOS':''}</div>${rpkOutcomeMarkup(m)}<div class="detail-state">${['recentFinished','finished'].includes(st.phase)?'':st.label}</div>${overtimeMarkup(m,false)}</div><div class="detail-team">${txt(m,'vieraslogo')&&/^https?:\/\//i.test(txt(m,'vieraslogo'))?`<img class="detail-team-logo" src="${esc(txt(m,'vieraslogo'))}" alt="${esc(away)}" onerror="this.remove()">`:''}${esc(away)}</div></div></div>`;$("detailRpk").innerHTML=rpkMarkup(m,false);
renderLineups(m);
const stats={home:{shots:0,on:0,corners:0,cornerGoals:0,penalties:0,minutes:0},away:{shots:0,on:0,corners:0,cornerGoals:0,penalties:0,minutes:0}};const cornerEvents=allEv.filter(e=>e.type==='kulma');for(const e of ev){const side=eventSide(e,m);if(!side)continue;if(e.type==='maali'){stats[side].shots++;stats[side].on++;}if(e.type==='laukaus'||e.type==='laukausohi'||e.type==='ohi')stats[side].shots++;if(e.type==='laukaus')stats[side].on++;if(e.type==='kulma')stats[side].corners++;if(e.type==='maali'&&goalSpecialSuffix(e)==='kl'){stats[side].cornerGoals++;const rawTime=attr(e.node,'kulunutaika')||attr(e.node,'peliaika')||attr(e.node,'aika');const duplicate=!!rawTime&&cornerEvents.some(c=>{const cornerTime=attr(c.node,'kulunutaika')||attr(c.node,'peliaika')||attr(c.node,'aika');return !!cornerTime&&eventSide(c,m)===side&&c.sec===e.sec});if(!duplicate)stats[side].corners++;}if(isPenaltyType(e.type))stats[side].penalties++;stats[side].minutes+=penaltyMinutes(e.type)}
const statRows=[['Laukaukset','shots'],['Laukaukset kohti maalia','on'],['Kulmalyönnit (maalit)','corners'],['Rangaistukset','penalties'],['Rangaistusminuutit','minutes']];$('stats').innerHTML=statRows.map(([label,key])=>`<div class="stat"><div class="stat-value">${key==='corners'?`${stats.home.corners} (${stats.home.cornerGoals}) – ${stats.away.corners} (${stats.away.cornerGoals})`:`${stats.home[key]} – ${stats.away[key]}`}</div><div class="stat-label">${label}</div></div>`).join('')+`<div class="stat"><div class="stat-value">${esc(attendanceCount(m)||'–')}</div><div class="stat-label">Yleisömäärä</div></div>`;
$('events').innerHTML=ev.length?ev.slice().reverse().map(e=>{const typ=goalEventTitle(e),goal=e.type==='maali',pen=isPenaltyType(e.type),isNew=eventIsNew(m,e),flash=eventJustArrived(m,e);return `<div class="event ${isNew?'is-new':''} ${flash?'flash':''} ${goal?'goal-event':pen?'penalty-event':'other-event'}"><div class="event-minute">${esc(e.tm||'–')}</div><div class="event-main"><div class="event-title-row"><div class="event-type">${esc(typ)}</div></div><div class="event-detail">${esc([e.player,eventDetailLabel(e)].filter(Boolean).join(' · ')||'–')}</div></div><div class="goal-score-col">${goal&&e.scoreAfter?`<div class="goal-score">${esc(e.scoreAfter)}</div>`:''}</div><div class="event-team">${esc(sideName(e,m))}<br><span class="tag ${goal?'goal':pen?'penalty':''}">${goal?'MAALI':pen?'RANGAISTUS':'TAPAHTUMA'}</span></div></div>`}).join(''):'<div class="empty">Ottelusta ei löytynyt tapahtumamerkintöjä.</div>'}
function openMatch(id,updateUrl=true){const doc=new DOMParser().parseFromString(latestXml,'application/xml');const m=[...doc.getElementsByTagName('ottelu')].find(x=>txt(x,'otteluid')===String(id));if(!m){showError('Ottelua ei löytynyt valitulta päivältä.');return}selectedId=String(id);$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');renderDetail(m);if(!rosterCache.has(selectedId))loadMatchRoster(selectedId,m);clearError();if(updateUrl){const u=new URL(location.href);u.searchParams.set('pvm',date);u.searchParams.set('ottelu',selectedId);history.pushState({detail:true},'',u)}}
function showList(updateUrl=true){selectedId='';$('detailView').classList.add('hidden');$('listView').classList.remove('hidden');if(updateUrl){const u=new URL(location.href);u.searchParams.delete('ottelu');history.pushState({},'',u)}}
$('matches').addEventListener('click',e=>{const b=e.target.closest('[data-id]');if(b)openMatch(b.dataset.id)});$('seriesFilter').addEventListener('change',e=>{selectedSeries=e.target.value;syncNavLinks();renderMatches(allMatches)});$('dateBtn').addEventListener('click',()=>{date=$('dateInput').value||localDate();updateTournamentForDate();syncNavLinks();selectedId='';const u=new URL(location.href);u.searchParams.set('pvm',date);u.searchParams.delete('ottelu');history.pushState({},'',u);showList(false);loadDay()});$('prevGameDay').addEventListener('click',e=>goToGameDay(e.currentTarget.dataset.date));$('nextGameDay').addEventListener('click',e=>goToGameDay(e.currentTarget.dataset.date));$('dateInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('dateBtn').click()});$('backBtn').addEventListener('click',()=>showList());$('refreshBtn').addEventListener('click',()=>loadDay());window.addEventListener('popstate',()=>{const u=new URL(location.href),id=u.searchParams.get('ottelu');date=u.searchParams.get('pvm')||date;updateTournamentForDate();syncNavLinks();if(id){selectedId=id;loadDay()}else showList(false)});
loadDay();refreshTimer=setInterval(()=>{if(document.visibilityState==='visible')loadDay()},refresh*1000);
})();
</script>
<script>
(()=>{'use strict';
 const KEY='bandylive-font-scale-v1',MIN=0.8,MAX=1.5,STEP=0.1;
 const root=document.documentElement;
 const minus=document.querySelector('[data-font-minus]');
 const plus=document.querySelector('[data-font-plus]');
 const reset=document.querySelector('[data-font-reset]');
 if(!minus||!plus||!reset)return;
 let scale=1;
 const clamp=v=>Math.max(MIN,Math.min(MAX,Math.round(v*10)/10));
 const read=()=>{try{const n=Number(localStorage.getItem(KEY));return Number.isFinite(n)&&n>0?clamp(n):1}catch(_){return 1}};
 const write=v=>{scale=clamp(v);try{localStorage.setItem(KEY,String(scale))}catch(_){}apply()};
 function apply(){root.style.setProperty('--bl-font-scale',String(scale));const pct=Math.round(scale*100)+'%';reset.textContent=pct+' ↺';reset.title='Palauta alkuperäiseen fonttikokoon (100 %)';reset.setAttribute('aria-label','Nykyinen fonttikoko '+pct+'. Palauta 100 prosenttiin');minus.disabled=scale<=MIN;plus.disabled=scale>=MAX;}
 scale=read();apply();
 minus.addEventListener('click',()=>write(scale-STEP));
 plus.addEventListener('click',()=>write(scale+STEP));
 reset.addEventListener('click',()=>write(1));
 window.addEventListener('storage',e=>{if(e.key===KEY){scale=read();apply()}});
 window.addEventListener('pageshow',()=>{const next=read();if(next!==scale){scale=next;apply()}});
})();
</script>

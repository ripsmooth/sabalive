<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salibandy · Tilastot</title><style>

:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1;--gfx-width:1200px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.gfx{opacity:1;transition:opacity .45s ease-in-out;will-change:opacity;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
body.gfx-hidden .gfx{opacity:0;pointer-events:none}
.hidden{display:none!important}
.err{position:fixed;left:8px;bottom:8px;background:rgba(16,24,32,.96);border-left:4px solid var(--accent);padding:10px 14px;color:#fff;font-size:14px;max-width:calc(100vw - 16px)}
.logo{object-fit:contain;display:block}
.fallback{display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-weight:900;background:var(--ink);flex:0 0 auto}

.stage{position:absolute;left:calc(50% + var(--offset-x));bottom:calc(50px - var(--offset-y));width:var(--gfx-width);max-width:calc(100vw - 16px);transform:translateX(-50%) scale(var(--scale), var(--scale-y, var(--scale)));transform-origin:bottom center}
.header{height:145px;display:grid;grid-template-columns:minmax(0,1fr) 280px minmax(0,1fr);align-items:stretch;background:var(--accent)}
.team{min-width:0;background:rgba(16,24,32,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:12px 22px}
.team.a{clip-path:polygon(0 0,100% 0,calc(100% - 18px) 100%,0 100%)}
.team.b{clip-path:polygon(18px 0,100% 0,100% 100%,0 100%)}
.logo{width:70px;height:70px}.fallback{width:70px;height:70px;font-size:22px}
.teamname{font-size:clamp(18px,1.8vw,29px);font-weight:900;text-transform:uppercase;text-align:center;line-height:1.05}
.heading{display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;color:var(--ink);font-size:31px;font-weight:900;letter-spacing:.07em;text-transform:uppercase}
.rows{background:rgba(16,24,32,.98);border-top:4px solid var(--accent);padding:8px 0}
.row{display:grid;grid-template-columns:minmax(0,1fr) 350px minmax(0,1fr);min-height:58px;align-items:stretch;border-bottom:1px solid #34434d}
.row:last-child{border:0}.value{font-size:29px;font-weight:900;padding:6px 30px;display:flex;align-items:center;color:#fff}
.value.a{justify-content:flex-start}.value.b{justify-content:flex-end}
.label{background:#1b2a35;border-left:2px solid var(--accent);border-right:2px solid var(--accent);display:flex;align-items:center;justify-content:center;text-align:center;padding:7px 12px;font-size:16px;font-weight:900;line-height:1.15;letter-spacing:.025em;text-transform:uppercase}
@media(max-width:750px){.header{height:105px;grid-template-columns:1fr 125px 1fr}.logo,.fallback{width:48px;height:48px}.teamname{font-size:14px}.heading{font-size:18px}.row{grid-template-columns:minmax(0,1fr) 150px minmax(0,1fr);min-height:45px}.value{font-size:20px;padding:5px 10px}.label{font-size:11px;padding:5px}}
</style></head><body><div class="gfx stage">
<div class="header"><div class="team a"><div id="logoA" class="fallback">A</div><div id="teamAName" class="teamname">KOTI</div></div><div class="heading">TILASTOT</div><div class="team b"><div id="logoB" class="fallback">B</div><div id="teamBName" class="teamname">VIERAS</div></div></div>
<div class="rows">
<div class="row"><div class="value a" id="goalsA">0</div><div class="label">Maalit</div><div class="value b" id="goalsB">0</div></div>
<div class="row"><div class="value a" id="powerplayA">0</div><div class="label">Ylivoimamaalit</div><div class="value b" id="powerplayB">0</div></div>
<div class="row"><div class="value a" id="shorthandedA">0</div><div class="label">Alivoimamaalit</div><div class="value b" id="shorthandedB">0</div></div>
<div class="row"><div class="value a" id="savesA">0</div><div class="label">Maalivahdin torjunnat</div><div class="value b" id="savesB">0</div></div>
<div class="row"><div class="value a" id="penaltiesA">0</div><div class="label">Rangaistukset</div><div class="value b" id="penaltiesB">0</div></div>
</div></div><div id="error" class="err hidden"></div>
<script>
const q=new URLSearchParams(location.search);
let matchId=q.get('match_id')||q.get('ottelu')||'';
let defaultMatchPromise=null;
async function ensureMatchId(){if(matchId)return matchId;if(!defaultMatchPromise)defaultMatchPromise=fetch('/api/salibandy-default-match',{cache:'no-store'}).then(r=>r.json()).then(d=>{matchId=String(d.match_id||'953141');return matchId}).catch(()=>{matchId='953141';return matchId});return defaultMatchPromise;}
const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||3)));
const offsetX=Number.isFinite(Number(q.get('offsetX')))?Number(q.get('offsetX')):0;
const offsetY=Number.isFinite(Number(q.get('offsetY')))?Number(q.get('offsetY')):0;
const scale=Math.max(.5,Math.min(2.5,Number(q.get('scale')||1)));
const width=Math.max(500,Math.min(1920,Number(q.get('width')||1200)));
document.documentElement.style.setProperty('--offset-x',offsetX+'px');
document.documentElement.style.setProperty('--offset-y',offsetY+'px');
document.documentElement.style.setProperty('--scale',scale);
document.documentElement.style.setProperty('--gfx-width',width+'px');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getMatch(){await ensureMatchId();const u=new URL('/api/salibandy-match',location.origin);u.searchParams.set('match_id',matchId);u.searchParams.set('timeStamp',Date.now());return fetch(u,{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d?.error||('API vastasi '+r.status));if(d.call?.status&&d.call.status!=='ok')throw Error('TorneoPal: '+d.call.status);if(!d.match)throw Error('Ottelutietoja ei löytynyt.');return d.match})}
function setText(id,value){const e=$(id);if(e)e.textContent=value??''}
function setLogo(id,url,name){const e=$(id);if(!e)return;e.innerHTML='';if(url&&/^https?:\/\//i.test(url)){const im=document.createElement('img');im.className='logo';im.src=url;im.alt='';im.onerror=()=>fallback();e.className='';e.appendChild(im);function fallback(){e.className='fallback';e.textContent=(name||'?').slice(0,2).toUpperCase()}}else{e.className='fallback';e.textContent=(name||'?').slice(0,2).toUpperCase()}}
function teamFields(m){return {a:{id:String(m.team_A_id||''),name:m.team_A_name||m.club_A_name||'KOTI',logo:m.club_A_crest||m.team_A_crest||''},b:{id:String(m.team_B_id||''),name:m.team_B_name||m.club_B_name||'VIERAS',logo:m.club_B_crest||m.team_B_crest||''}}}
function getScore(m){return {a:m.live_A??m.fs_A??'0',b:m.live_B??m.fs_B??'0'}}
function matchClock(m){const status=String(m.status||'').toLowerCase();if(['played','finished','over'].includes(status))return 'LOPPUTULOS';if(m.live_time_mmss)return String(m.live_time_mmss);if(m.live_time)return String(m.live_time);return m.time?String(m.time).slice(0,5):''}
async function updateVisibility(key,defaultVisible){try{const r=await fetch('/api/salibandy-graphics-state',{cache:'no-store'});if(!r.ok)return;const d=await r.json();document.body.classList.toggle('gfx-hidden',d[key]!==true)}catch(e){/* retain default visibility if remote control is unreachable */}}
function startVisibility(key,defaultVisible){const remote=new URLSearchParams(location.search).get('remote')==='1';if(!remote){document.body.classList.remove('gfx-hidden');return}if(!defaultVisible)document.body.classList.add('gfx-hidden');updateVisibility(key,defaultVisible);setInterval(()=>updateVisibility(key,defaultVisible),2000)}
function showError(err){const e=$('error');if(e){e.textContent='Salibandy: '+(err?.message||err);e.classList.remove('hidden')}}
function clearError(){const e=$('error');if(e)e.classList.add('hidden')}

function calcStats(m){
 const teams=teamFields(m),players=Array.isArray(m.lineups)?m.lineups:[],bookings=Array.isArray(m.bookings)?m.bookings:[],goals=Array.isArray(m.goals)?m.goals:[];
 const out={A:{goals:0,powerplay:0,shorthanded:0,saves:0,penalties:0},B:{goals:0,powerplay:0,shorthanded:0,saves:0,penalties:0}};
 const sideFor=id=>String(id)===teams.a.id?'A':String(id)===teams.b.id?'B':'';
 for(const g of goals){const side=sideFor(g.team_id);if(side)out[side].goals++;}
 for(const p of players){const side=sideFor(p.team_id);if(side)out[side].saves+=Number(p.saves)||0;}
 for(const b of bookings){const side=sideFor(b.team_id);if(!side)continue;const code=String(b.code||'').toLowerCase(),fi=String(b.code_fi||'').toLowerCase();if(/^\d+\s*min/.test(code)||/^\d+\s*min/.test(fi))out[side].penalties++;}
 // TÄRKEÄ: match.goals on pelkkä yhteenvetolista, jossa description on usein vain tulos
 // (esim. "3-8"). Maalin lisämerkinnät YV/AV tulevat varsinaisista match.events-tapahtumista.
 // Käytetään eventtejä ensin ja luetaan merkintä niistä tekstikentistä, joissa TorneoPal voi
 // säilyttää tapahtuman selitteen. Näin YV2/AV2 lasketaan samaan tilastoluokkaan kuin YV/AV.
 const events=Array.isArray(m.events)?m.events:[];
 const eventGoals=events.filter(e=>['maali','goal'].includes(String(e.code||'').trim().toLowerCase()));
 const markedGoals=eventGoals.length?eventGoals:goals;
 const isMark=(text,kind)=>{
   const v=String(text||'').toUpperCase();
   if(kind==='YV') return /(^|[^A-Z0-9])YV2?(?=$|[^A-Z0-9])/.test(v)||/YLIVOIMA|POWER.?PLAY|MAN.?ADVANTAGE/.test(v);
   return /(^|[^A-Z0-9])AV2?(?=$|[^A-Z0-9])/.test(v)||/ALIVOIMA|SHORT.?HANDED|MAN.?DOWN/.test(v);
 };
 for(const g of markedGoals){
   const side=sideFor(g.team_id);if(!side)continue;
   // Kenttien nimet voivat vaihdella API-versioittain. Otetaan mukaan vain selitteeseen/
   // maalityyppiin viittaavat kentät, eikä esimerkiksi pelaajan nimeä tai tuloslukemia.
   const text=Object.entries(g).filter(([k,v])=>typeof v==='string'||typeof v==='number')
     .filter(([k])=>/(code|desc|note|text|goal|mark|label|extra|annot|comment|type|variant|reason)/i.test(k))
     .map(([,v])=>String(v)).join(' ');
   if(isMark(text,'YV'))out[side].powerplay++;
   if(isMark(text,'AV'))out[side].shorthanded++;
 }
 return out;
}
async function update(){try{const m=await getMatch(),t=teamFields(m),st=calcStats(m);setLogo('logoA',t.a.logo,t.a.name);setLogo('logoB',t.b.logo,t.b.name);setText('teamAName',t.a.name);setText('teamBName',t.b.name);for(const side of ['A','B']){const x=st[side];setText('goals'+side,x.goals);setText('powerplay'+side,x.powerplay);setText('shorthanded'+side,x.shorthanded);setText('saves'+side,x.saves);setText('penalties'+side,x.penalties)}clearError()}catch(e){showError(e)}}
startVisibility('stats',false);update();setInterval(update,refresh*1000);
</script>
<script>
/* URL-kohtainen koon hienosäätö: width= ja height= ovat pikseleitä ennen yleistä scale-kerrointa. */
(function applyManualDimensions(){
  const sizeParams = new URLSearchParams(window.location.search);
  const sizeStage = document.querySelector('.stage');
  if (!sizeStage) return;
  const defaultWidth = 1200;
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const queryNumber = (key, fallback, min, max) => {
    if (!sizeParams.has(key)) return fallback;
    const n = Number(sizeParams.get(key));
    return Number.isFinite(n) && n > 0 ? clamp(n, min, max) : fallback;
  };
  const targetWidth = queryNumber('width', defaultWidth, 240, 2400);
  const requestedHeight = sizeParams.has('height') ? queryNumber('height', null, 40, 2160) : null;
  const overallScale = queryNumber('scale', 1, 0.5, 2.5);
  const root = document.documentElement;
  root.style.setProperty('--scale', String(overallScale));
  root.style.setProperty('--gfx-width', targetWidth + 'px');
  root.style.setProperty('--score-width', targetWidth + 'px');
  /* Inline-arvot voittavat vanhat sivukohtaiset max-width/width-säännöt. */
  sizeStage.style.width = targetWidth + 'px';
  sizeStage.style.maxWidth = 'none';

  let debugBox = null;
  if (sizeParams.get('debug') === '1') {
    debugBox = document.createElement('div');
    debugBox.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:2147483647;background:rgba(16,24,32,.96);border:1px solid #e8c547;color:#fff;padding:7px 9px;font:12px/1.45 Arial,sans-serif;pointer-events:none;white-space:pre-line';
    document.body.appendChild(debugBox);
  }
  function updateSize(){
    const naturalHeight = sizeStage.offsetHeight;
    if (!naturalHeight) return;
    const verticalFit = requestedHeight === null ? 1 : requestedHeight / naturalHeight;
    root.style.setProperty('--scale-y', String(overallScale * verticalFit));
    if (debugBox) {
      const r = sizeStage.getBoundingClientRect();
      debugBox.textContent = 'KOKOSÄÄDÖT\nwidth=' + targetWidth + ' px\nheight=' + (requestedHeight === null ? 'auto (' + Math.round(naturalHeight) + ' px)' : requestedHeight + ' px') + '\nscale=' + overallScale + '\nNäkyvä laatikko: ' + Math.round(r.width) + ' × ' + Math.round(r.height) + ' px';
    }
  }
  /* Sisältökorkeus voi muuttua, kun pelaajat/tapahtumat päivittyvät. */
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => requestAnimationFrame(updateSize));
    ro.observe(sizeStage);
  }
  window.addEventListener('resize', updateSize);
  requestAnimationFrame(updateSize);
})();
</script>
</body></html>

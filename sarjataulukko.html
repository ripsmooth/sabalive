<!doctype html>
<html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jääpallo · Bandyliigan sarjataulukko</title>
<style>
:root{--ink:#101820;--panel:#17232e;--panel2:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--width:1120px;--scale:1}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}.wrap{position:absolute;left:50%;top:50%;width:var(--width);max-width:calc(100vw - 20px);transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center;filter:drop-shadow(0 4px 12px #0005)}.header{height:88px;background:rgba(16,24,32,.98);border-bottom:4px solid var(--accent);display:grid;grid-template-columns:1fr 270px 1fr;align-items:stretch}.header.long-heading{grid-template-columns:1fr 330px 1fr}.header.long-heading .season{font-size:20px;line-height:1.05;white-space:nowrap;padding:0 18px;clip-path:polygon(4% 0,96% 0,100% 100%,0 100%)}.brand{display:flex;align-items:center;padding:0 24px;font-size:clamp(20px,2.2vw,32px);font-weight:900;letter-spacing:.035em;text-transform:uppercase}.season{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);font-size:24px;font-weight:900;text-transform:uppercase;clip-path:polygon(8% 0,92% 0,100% 100%,0 100%)}.meta{display:flex;align-items:center;justify-content:flex-end;padding:0 24px;color:var(--muted);font-size:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.tablebox{margin-top:10px;background:rgba(16,24,32,.98);border-top:3px solid var(--accent);padding:0 0 4px}.standings-grid{display:grid;grid-template-columns:1fr;gap:8px}.standings-panel{min-width:0}.standings-heading{padding:8px 14px 6px;background:#1b2a35;color:var(--accent);font-size:18px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid #34434d}.standings-panel table{margin:0}table{width:100%;border-collapse:collapse;table-layout:fixed}thead{background:var(--panel2)}th{height:45px;padding:8px 9px;color:var(--accent);font-size:14px;letter-spacing:.06em;text-transform:uppercase;text-align:center;font-weight:900}th:nth-child(2){text-align:left;padding-left:18px}td{height:39px;padding:6px 9px;border-bottom:1px solid #34434d;text-align:center;font-size:18px;font-weight:700}tbody tr:nth-child(odd){background:#17232e}tbody tr:nth-child(even){background:#121c24}td:first-child{color:var(--accent);font-size:19px;font-weight:900}td:nth-child(2){text-align:left;padding-left:18px;font-size:19px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.teamcell{display:flex;align-items:center;gap:10px;min-width:0}.teamname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.points{color:var(--accent);font-size:22px;font-weight:900}.goals{white-space:nowrap}.status{display:flex;justify-content:space-between;padding:8px 12px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.error{background:rgba(16,24,32,.97);border-left:4px solid var(--accent);padding:12px 14px;font-size:14px;color:#fff}.hidden{display:none!important}
@media(max-width:800px){.standings-heading{font-size:13px;padding:5px 8px}.header{height:64px;grid-template-columns:1fr 150px 1fr}.brand{font-size:16px;padding:0 10px}.season{font-size:16px}.meta{font-size:10px;padding:0 10px}.header.long-heading{grid-template-columns:1fr 190px 1fr}.header.long-heading .season{font-size:12px;padding:0 6px;clip-path:polygon(2% 0,98% 0,100% 100%,0 100%)}th{font-size:10px;padding:5px 3px;height:32px}td{font-size:13px;padding:4px 3px;height:30px}td:nth-child(2){font-size:13px;padding-left:7px}.points{font-size:15px}.status{font-size:8px}}
</style></head><body>
<div class="wrap" id="wrap"><div class="header"><div class="brand">BANDYLIIGA</div><div class="season" id="graphicTitle">SARJATAULUKKO</div><div class="meta" id="seasonMeta">KAUSI 2026–2027</div></div><div class="tablebox"><table aria-label="Bandyliigan sarjataulukko"><thead><tr><th style="width:6%">SIJ.</th><th style="width:32%">JOUKKUE</th><th style="width:7%">O</th><th style="width:7%">V</th><th style="width:7%">T</th><th style="width:7%">H</th><th style="width:14%">MAALIT</th><th style="width:8%">ME</th><th style="width:12%">P</th></tr></thead><tbody id="rows"><tr><td colspan="9">Haetaan sarjataulukkoa…</td></tr></tbody></table></div><div class="status"><span>JÄÄPALLO · MIESTEN BANDYLIIGA</span><span id="updated">HAETAAN SARJATIETOJA</span></div><div id="err" class="error hidden"></div></div>
<script>(()=>{const q=new URLSearchParams(location.search),$=id=>document.getElementById(id);const turnaus=q.get('turnaus')||'sjpl_2627',sarja=q.get('sarja')||'MBL',refresh=Math.max(5,Math.min(300,Number(q.get('refresh')||30)));const viewRaw=(q.get('view')||'runkosarja').toLowerCase();const view=({runkosarja:'runkosarja',main:'runkosarja',ylempi:'ylempi',upper:'ylempi',alempi:'alempi',lower:'alempi'})[viewRaw]||'runkosarja';const viewTitles={runkosarja:'RUNKOSARJA',ylempi:'YLEMPI JATKOSARJA',alempi:'ALEMPI JATKOSARJA'};$('graphicTitle').textContent=viewTitles[view];if(view!=='runkosarja')$('graphicTitle').parentElement.classList.add('long-heading');const seasonMatch=turnaus.match(/(\d{2})(\d{2})$/);if(seasonMatch)$('seasonMeta').textContent='KAUSI 20'+seasonMatch[1]+'–20'+seasonMatch[2];const num=s=>{const m=String(s||'').replace(/\s/g,'').match(/-?\d+(?:[.,]\d+)?/);return m?Number(m[0].replace(',','.')):null};const clean=s=>String(s||'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim();const TEAM_RE=/akilles|botnia|hifk|jps|kampparit|narukerä|ols|veiterä|wp\s*35/i;
function cells(row){return [...row.querySelectorAll(':scope > th, :scope > td')].map(c=>clean(c.innerText||c.textContent))}
function rowsInThisTable(table){return [...table.querySelectorAll('tr')].filter(tr=>tr.closest('table')===table)}
function teamIndexIn(c,row){const known=c.findIndex(v=>TEAM_RE.test(v));if(known>=0)return known;if(row){const rowCells=[...row.querySelectorAll(':scope > th, :scope > td')];const structural=rowCells.findIndex(cell=>cell.classList.contains('lohko_joukkue'));const rank=rowCells.length?num(clean(rowCells[0].innerText||rowCells[0].textContent)):null;if(structural>=0&&rank!==null&&clean(rowCells[structural].innerText||rowCells[structural].textContent).toLocaleLowerCase('fi-FI')!=='joukkue')return structural}return -1}
function headingKey(value){const s=clean(value).toLocaleLowerCase('fi-FI').replace(/\s+/g,' ').trim();if(/^runkosarja(?:\b.*)?$/.test(s)&&s.length<50)return 'runkosarja';if(/^ylempi\s+jatkosarja(?:\b.*)?$/.test(s)&&s.length<60)return 'ylempi';if(/^alempi\s+jatkosarja(?:\b.*)?$/.test(s)&&s.length<60)return 'alempi';return ''}
function tableSections(doc){const map=new Map();let active='';for(const el of [...doc.body.querySelectorAll('*')]){if(el.tagName==='TABLE'){map.set(el,active);continue}const key=headingKey(el.textContent||'');if(key)active=key}return map}
function scoreTable(table){const trs=rowsInThisTable(table);let teamRows=0,statRows=0;for(const tr of trs){const c=cells(tr),i=teamIndexIn(c,tr);if(i>=0){teamRows++;const stat=c.slice(i+1).map(clean).filter(v=>v!=='');if(stat.length>=6)statRows++}}return {teamRows,statRows,rowCount:trs.length,score:teamRows*10+statRows*3+(trs.length>3?1:0)}}
function findTable(doc,targetView){const all=[...doc.querySelectorAll('table')],sections=tableSections(doc);const scored=all.map((table,index)=>({table,index,section:sections.get(table)||'',...scoreTable(table)})).filter(x=>x.teamRows>0);if(!scored.length)return {table:null,sections,diagnostics:all.map((table,index)=>({table,index,section:sections.get(table)||'',...scoreTable(table)}))};const exact=scored.filter(x=>x.section===targetView).sort((a,b)=>b.score-a.score);if(exact.length)return {table:exact[0].table,sections,diagnostics:all.map((table,index)=>({table,index,section:sections.get(table)||'',...scoreTable(table)}))};const main=[...scored].sort((a,b)=>b.teamRows-a.teamRows||b.score-a.score)[0];let selected=null;if(targetView==='runkosarja')selected=main;else{const others=scored.filter(x=>x!==main).sort((a,b)=>a.index-b.index);selected=targetView==='ylempi'?others[0]:others[1]}return {table:selected?.table||null,sections,diagnostics:all.map((table,index)=>({table,index,section:sections.get(table)||'',...scoreTable(table)}))}}
function parseTable(table){const trs=rowsInThisTable(table);const out=[];for(const tr of trs){const cs=cells(tr),teamIndex=teamIndexIn(cs,tr);if(teamIndex<0)continue;const team=cs[teamIndex];/* TorneoPalin taulukkorivi on muodossa sijoitus, mahdollinen logon solu, joukkue, O, V, T, H, maalit, P. Otsikoissa on ryhmittelyrivejä, joten tilastoja ei pidä paikantaa otsikkoindeksien perusteella. *//* TorneoPalin riveillä on tyhjiä soluja sekä välissä että ennen tilastolohkoa. Lisäksi aiemmissa soluissa voi olla '-' -paikkamerkkejä. Varsinaiset tilastot ovat rivin kuusi viimeistä ei-tyhjää arvoa: O,V,T,H,maalit,P. Rajataan ensin tyhjät pois ja otetaan lopusta kuusi; siten välisolut tai aiemmat viivat eivät siirrä arvoja. Nolla säilyy arvona '0'. */const stat=cs.slice(teamIndex+1).map(clean).filter(v=>v!=='').slice(-6);const read=i=>stat[i]===undefined?'':clean(stat[i]);const asNumber=i=>num(read(i));const played=asNumber(0),wins=asNumber(1),draws=asNumber(2),losses=asNumber(3);const goals=read(4);const points=asNumber(5);const gm=goals.match(/(-?\d+)\s*[-–:]\s*(-?\d+)/);const diff=gm?Number(gm[1])-Number(gm[2]):null;const rank=num(cs[0]);out.push({rank:rank??out.length+1,team,played:played===null?'—':played,wins:wins===null?'—':wins,draws:draws===null?'—':draws,losses:losses===null?'—':losses,goals:goals||'—',diff:diff===null?'—':diff,points:points===null?'—':points});}return out}
function makeTable(data){const table=document.createElement('table');table.setAttribute('aria-label','Sarjataulukko');table.innerHTML='<thead><tr><th style="width:6%">SIJ.</th><th style="width:32%">JOUKKUE</th><th style="width:7%">O</th><th style="width:7%">V</th><th style="width:7%">T</th><th style="width:7%">H</th><th style="width:14%">MAALIT</th><th style="width:8%">ME</th><th style="width:12%">P</th></tr></thead><tbody></tbody>';const tbody=table.querySelector('tbody');for(const r of data){const tr=document.createElement('tr');const values=[r.rank,r.team,r.played,r.wins,r.draws,r.losses,r.goals,r.diff,r.points];values.forEach((v,i)=>{const td=document.createElement('td');if(i===1){const d=document.createElement('div');d.className='teamcell';const n=document.createElement('span');n.className='teamname';n.textContent=v;d.append(n);td.append(d)}else{td.textContent=v;if(i===8)td.className='points';if(i===6)td.className='goals'}tr.append(td)});tbody.append(tr)}return table}
function render(data){if(!data.length)throw Error('Sarjataulukkoa ei tunnistettu TorneoPalin sivulta. Tarkista sarjan HTML-rakenne.');const box=document.querySelector('.tablebox');box.replaceChildren(makeTable(data));fit()}
function tableHeading(table,index){
  const text=el=>clean(el?.innerText||el?.textContent||'').trim();
  // TorneoPalin nykyisessä sarja.php-rakenteessa lohkon otsikko ja taulukko
  // ovat saman .lohkoclass-divin lapsia. Otsikko on h3:n linkissä.
  const block=table.closest('div.lohkoclass');
  if(block){
    const heading=[...block.children].find(el=>/^H[1-6]$/.test(el.tagName));
    if(heading){
      const link=heading.querySelector('a');
      const label=text(link||heading);
      if(label) return label;
    }
  }
  // Varatuki muille TorneoPal-sivupohjille: etsi lähin edeltävä otsikko,
  // mutta älä koskaan poimi sivun pääotsikkoa (esim. Miesten Suomen Cup).
  let node=table;
  for(let depth=0;node&&depth<5;depth++,node=node.parentElement){
    let prev=node.previousElementSibling;
    while(prev){
      if(prev.matches?.('h1,h2,h3,h4,h5,h6')){
        const label=text(prev.querySelector('a')||prev);
        if(label && !/sarjataulukko|bandyliiga|suomen cup/i.test(label)) return label;
      }
      prev=prev.previousElementSibling;
    }
  }
  return 'LOHKO '+(index+1);
}
function renderMultiple(items){if(!items.length)throw Error('Sarjataulukoita ei tunnistettu TorneoPalin sivulta.');const box=document.querySelector('.tablebox');const grid=document.createElement('div');grid.className='standings-grid';for(const item of items){const panel=document.createElement('section');panel.className='standings-panel';const heading=document.createElement('div');heading.className='standings-heading';heading.textContent=item.title;panel.append(heading,makeTable(item.rows));grid.append(panel)}box.replaceChildren(grid);fit()}function fit(){const wrap=$('wrap');wrap.style.setProperty('--width',Math.max(600,Math.min(1120,Number(q.get('width')||1120)))+'px');const maxH=innerHeight-16;wrap.style.setProperty('--scale','1');const rect=wrap.getBoundingClientRect();const naturalW=wrap.offsetWidth,naturalH=wrap.offsetHeight;let scale=Math.min(1,(innerWidth-16)/naturalW,maxH/naturalH);if(q.has('scale'))scale=Math.min(2,Math.max(.3,Number(q.get('scale'))/100||1));wrap.style.setProperty('--scale',String(scale));}function renderUnavailable(message){$('rows').innerHTML='';const tr=document.createElement('tr');const td=document.createElement('td');td.colSpan=9;td.textContent=message;td.style.cssText='height:96px;text-align:center;color:#bdc7d0;font-size:20px;font-weight:800;letter-spacing:.02em';tr.append(td);$('rows').append(tr);$('updated').textContent='EI VIELÄ SAATAVILLA';$('err').classList.add('hidden');fit()}
async function update(){try{const u=new URL('/api/standings',location.origin);u.searchParams.set('turnaus',turnaus);u.searchParams.set('sarja',sarja);const r=await fetch(q.get('api')||u.toString(),{cache:'no-store'});const body=await r.text();if(!r.ok)throw Error('TorneoPal vastasi '+r.status+(body?': '+clean(body).slice(0,160):''));const doc=new DOMParser().parseFromString(body,'text/html');const allTables=[...doc.querySelectorAll('table')];const found=findTable(doc,view);const table=found.table;const debugBox=$('debugDetails');const diagnostics=found.diagnostics;// TorneoPal käyttää oikeissa lohkotaulukoissa luokkaa .sarjataulukko.
// Tunnista nämä suoraan luokan perusteella, koska saman sivun muissa
// taulukoissa voi olla samoja joukkueiden nimiä tai tilastorivejä.
const standingsCandidates=[...doc.querySelectorAll('table.sarjataulukko')];
const validTables=standingsCandidates.filter(t=>scoreTable(t).teamRows>0);
const diag='HTML-taulukot: '+allTables.length+'; TorneoPal .sarjataulukko-taulukoita: '+standingsCandidates.length+'; näkymäparametri: '+view+'; tunnistetut sarjataulukot: '+validTables.length+'; taulukot: '+JSON.stringify(diagnostics.map(x=>({index:x.index,section:x.section,teamRows:x.teamRows,rowCount:x.rowCount})));/* Runkosarjanäkymässä näytetään kaikki oikeat sarjataulukot. Ottelulistat ja muut taulukot jäävät pois, koska niissä ei ole tunnistettuja joukkue- ja tilastorivejä. Jatkosarjan näkymät säilyttävät aiemman yksittäisen taulukon valintalogiikan. */if(validTables.length>1){$('graphicTitle').textContent='SARJATAULUKOT';$('graphicTitle').parentElement.classList.remove('long-heading');const items=validTables.map((t,i)=>({table:t,title:tableHeading(t,i),rows:parseTable(t)})).filter(x=>x.rows.length);if(debugBox)debugBox.textContent='HTTP '+r.status+'; '+diag+'; näytetään kaikki '+items.length+' sarjataulukkoa: '+items.map(x=>x.title+' ('+x.rows.length+' joukkuetta)').join('; ');renderMultiple(items);$('updated').textContent='PÄIVITETTY '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('err').classList.add('hidden');return}if(!table){if(debugBox)debugBox.textContent='HTTP '+r.status+'; '+diag;renderUnavailable(view==='ylempi'?'YLEMPI JATKOSARJA EI OLE VIELÄ SAATAVILLA TÄLLE KAUDELLE.':view==='alempi'?'ALEMPI JATKOSARJA EI OLE VIELÄ SAATAVILLA TÄLLE KAUDELLE.':'SARJATAULUKKOA EI VIELÄ LÖYDY.');return}const rawRows=rowsInThisTable(table);const firstTeamRow=rawRows.map(tr=>cells(tr)).find(c=>teamIndexIn(c)>=0)||[];const rows=parseTable(table);if(debugBox)debugBox.textContent='HTTP '+r.status+'; '+diag+'; valitun taulukon rivejä: '+rawRows.length+'; ensimmäinen joukkerivi: '+JSON.stringify(firstTeamRow)+'; valitut kuusi tilastoarvoa: '+JSON.stringify(firstTeamRow.slice(teamIndexIn(firstTeamRow)+1).map(clean).filter(v=>v!=='').slice(-6))+'; tulkittu rivi: '+JSON.stringify(rows[0]||null);render(rows);$('updated').textContent='PÄIVITETTY '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('err').classList.add('hidden')}catch(e){$('err').textContent='TorneoPal: '+e.message;$('err').classList.remove('hidden')}}function debug(){if(q.get('debug')!=='1')return;const p=document.createElement('div');p.id='bandylive-debug-panel';p.style.cssText='position:fixed;z-index:2147483647;left:8px;top:8px;max-width:min(460px,calc(100vw - 16px));max-height:45vh;overflow:auto;padding:10px 12px;background:rgba(5,10,15,.94);color:#fff;border:1px solid #e8c547;border-radius:6px;font:12px/1.45 Arial,sans-serif;box-shadow:0 4px 20px #0008';p.innerHTML='<b style="color:#e8c547">BANDYLIVE DEBUG · SARJATAULUKKO FIX08</b><div id="debugValues" style="margin-top:6px"></div><pre id="debugDetails" style="white-space:pre-wrap;overflow-wrap:anywhere;color:#fff;border-top:1px solid #ffffff30;margin-top:6px;padding-top:6px"></pre>';document.body.append(p);const f=n=>Math.round(n*100)/100;function up(){const e=$('wrap'),r=e.getBoundingClientRect(),c=getComputedStyle(e);$('debugValues').innerHTML=[['Elementti',r.width+' × '+r.height+' px'],['Sijainti','x '+f(r.left)+' / y '+f(r.top)],['CSS width',c.width],['Ikkuna',innerWidth+' × '+innerHeight+' px'],['Skaala',c.transform],['Päivitysväli',refresh+' s'],['URL',location.search]].map(([a,b])=>'<div style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff20;padding:3px 0"><span style="color:#bdc7d0">'+a+'</span><b style="text-align:right;overflow-wrap:anywhere">'+String(b).replace(/</g,'&lt;')+'</b></div>').join('')}up();addEventListener('resize',up);setInterval(up,1000)}debug();update();setInterval(update,refresh*1000);addEventListener('resize',fit);})();</script></body></html>

<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salibandy · Kokoonpanot</title><style>

:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1;--gfx-width:1200px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.gfx{opacity:1;transition:opacity .45s ease-in-out;will-change:opacity;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
body.gfx-hidden .gfx{opacity:0;pointer-events:none}
.hidden{display:none!important}
.err{position:fixed;left:8px;bottom:8px;background:rgba(16,24,32,.96);border-left:4px solid var(--accent);padding:10px 14px;color:#fff;font-size:14px;max-width:calc(100vw - 16px)}
.logo{object-fit:contain;display:block}
.fallback{display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-weight:900;background:var(--ink);flex:0 0 auto}

.stage{position:fixed;left:calc(50% + var(--offset-x));top:calc(50% + var(--offset-y));width:var(--gfx-width);max-width:none;transform:translate(-50%,-50%) scale(var(--scale), var(--scale-y, var(--scale)));transform-origin:center center}
.header{height:112px;display:grid;grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr);align-items:stretch;background:var(--accent);border-bottom:4px solid var(--accent)}
.team{display:flex;align-items:center;gap:17px;padding:12px 24px;min-width:0;background:rgba(16,24,32,.98)}.team.b{flex-direction:row-reverse;text-align:right}
.logo{width:70px;height:70px;flex:0 0 70px}.fallback{width:70px;height:70px;font-size:22px}
.teamname{font-size:clamp(18px,2vw,31px);font-weight:900;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mid{display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);font-size:26px;font-weight:900;text-transform:uppercase;text-align:center;clip-path:polygon(9% 0,91% 0,100% 100%,0 100%);padding:8px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.roster{background:rgba(16,24,32,.97);border-top:3px solid var(--accent);min-width:0;overflow:visible}
.roster-title{background:var(--panel);padding:11px 18px;display:flex;justify-content:space-between;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.roster-title span:last-child{color:var(--accent);font-size:12px}
.players{padding:7px 14px 12px;display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.player{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:8px;align-items:center;min-height:30px;border-bottom:1px solid #34434d;padding:2px 1px}
.number{display:flex;justify-content:center;align-items:center;background:var(--accent);color:var(--ink);font-size:15px;font-weight:900;min-height:25px;clip-path:polygon(0 0,100% 0,86% 100%,0 100%)}
.pname{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{color:var(--accent);font-size:10px;font-weight:900;white-space:nowrap}
.empty{padding:18px;color:var(--muted);font-size:14px}
@media(max-width:750px){.header{height:82px;grid-template-columns:minmax(0,1fr) 110px minmax(0,1fr)}.team{gap:8px;padding:7px}.logo,.fallback{width:43px;height:43px;flex-basis:43px}.teamname{font-size:13px}.mid{font-size:15px}.players{grid-template-columns:minmax(0,1fr);padding:5px}.pname{font-size:15.6px}.player{grid-template-columns:30px minmax(0,1fr) auto}.number{font-size:12px}}
</style></head><body><div class="gfx stage">
<div class="header"><div class="team"><div id="logoA" class="fallback">A</div><div id="teamAName" class="teamname">KOTI</div></div><div class="mid">KOKOONPANOT</div><div class="team b"><div id="teamBName" class="teamname">VIERAS</div><div id="logoB" class="fallback">B</div></div></div>
<div class="cols"><section class="roster"><div class="roster-title"><span id="titleA">KOTI</span><span id="countA">PELAAJAT</span></div><div id="playersA" class="players"></div><div id="emptyA" class="empty hidden">Kokoonpanoa ei ole julkaistu.</div></section><section class="roster"><div class="roster-title"><span id="titleB">VIERAS</span><span id="countB">PELAAJAT</span></div><div id="playersB" class="players"></div><div id="emptyB" class="empty hidden">Kokoonpanoa ei ole julkaistu.</div></section></div>
</div><div id="error" class="err hidden"></div>
<script>
const q=new URLSearchParams(location.search);
let matchId=q.get('match_id')||q.get('ottelu')||'';
let defaultMatchPromise=null;
async function ensureMatchId(){if(matchId)return matchId;if(!defaultMatchPromise)defaultMatchPromise=fetch('/api/salibandy-default-match',{cache:'no-store'}).then(r=>r.json()).then(d=>{matchId=String(d.match_id||'953141');return matchId}).catch(()=>{matchId='953141';return matchId});return defaultMatchPromise;}
const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||3)));
const offsetX=q.has('offsetX')&&String(q.get('offsetX')).trim()!==''&&Number.isFinite(Number(q.get('offsetX')))?Number(q.get('offsetX')):0;
const offsetY=q.has('offsetY')&&String(q.get('offsetY')).trim()!==''&&Number.isFinite(Number(q.get('offsetY')))?Number(q.get('offsetY')):0;
const scale=Math.max(.5,Math.min(2.5,Number(q.get('scale')||1)));
const width=Math.max(240,Math.min(2400,Number(q.get('width')||1200)));
document.documentElement.style.setProperty('--offset-x',offsetX+'px');
document.documentElement.style.setProperty('--offset-y',offsetY+'px');
document.documentElement.style.setProperty('--scale',scale);
document.documentElement.style.setProperty('--gfx-width',width+'px');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function getMatch(){await ensureMatchId();const u=new URL('/api/salibandy-match',location.origin);u.searchParams.set('match_id',matchId);u.searchParams.set('timeStamp',Date.now());return fetch(u,{cache:'no-store'}).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d?.error||('API vastasi '+r.status));if(d.call?.status&&d.call.status!=='ok')throw Error('TorneoPal: '+d.call.status);if(!d.match)throw Error('Ottelutietoja ei löytynyt.');return d.match})}
function setText(id,value){const e=$(id);if(e)e.textContent=value??''}
function setLogo(id,url,name){const e=$(id);if(!e)return;e.innerHTML='';if(url&&/^https?:\/\//i.test(url)){const im=document.createElement('img');im.className='logo';im.src=url;im.alt='';im.onerror=()=>fallback();e.className='';e.appendChild(im);function fallback(){e.className='fallback';e.textContent=(name||'?').slice(0,2).toUpperCase()}}else{e.className='fallback';e.textContent=(name||'?').slice(0,2).toUpperCase()}}
function teamFields(m){return {a:{id:String(m.team_A_id||''),name:m.team_A_name||m.club_A_name||'KOTI',logo:m.club_A_crest||m.team_A_crest||''},b:{id:String(m.team_B_id||''),name:m.team_B_name||m.club_B_name||'VIERAS',logo:m.club_B_crest||m.team_B_crest||''}}}
function getScore(m){return {a:m.live_A??m.fs_A??'0',b:m.live_B??m.fs_B??'0'}}
function matchClock(m){const status=String(m.status||'').toLowerCase();if(['played','finished','over'].includes(status))return 'LOPPUTULOS';if(m.live_time_mmss)return String(m.live_time_mmss);if(m.live_time)return String(m.live_time);return m.time?String(m.time).slice(0,5):''}
async function updateVisibility(key,defaultVisible){try{const r=await fetch('/api/salibandy-graphics-state',{cache:'no-store'});if(!r.ok)return;const d=await r.json();document.body.classList.toggle('gfx-hidden',d[key]!==true)}catch(e){/* retain default visibility if remote control is unreachable */}}
function startVisibility(key,defaultVisible){const remote=new URLSearchParams(location.search).get('remote')==='1';if(!remote){document.body.classList.remove('gfx-hidden');return}if(!defaultVisible)document.body.classList.add('gfx-hidden');updateVisibility(key,defaultVisible);setInterval(()=>updateVisibility(key,defaultVisible),2000)}
function showError(err){const e=$('error');if(e){e.textContent='Salibandy: '+(err?.message||err);e.classList.remove('hidden')}}
function clearError(){const e=$('error');if(e)e.classList.add('hidden')}

function renderLineup(side,players){const target=$('players'+side);target.innerHTML='';for(const p of players){const row=document.createElement('div');row.className='player';const n=document.createElement('div');n.className='number';n.textContent=p.shirt_number||'—';const nm=document.createElement('div');nm.className='pname';nm.textContent=p.player_name||'Tuntematon pelaaja';const tags=[];if(String(p.captain||'').toUpperCase()==='C')tags.push('C');else if(String(p.captain||'').toUpperCase()==='A')tags.push('A');if(String(p.position_fi||p.position||'').toLowerCase()==='mv')tags.push('MV');const tag=document.createElement('div');tag.className='tag';tag.textContent=tags.join(' · ');row.append(n,nm,tag);target.append(row)}}
async function update(){try{const m=await getMatch(),t=teamFields(m);setLogo('logoA',t.a.logo,t.a.name);setLogo('logoB',t.b.logo,t.b.name);setText('teamAName',t.a.name);setText('teamBName',t.b.name);setText('titleA',t.a.name);setText('titleB',t.b.name);const all=Array.isArray(m.lineups)?m.lineups:[];const a=all.filter(p=>String(p.team_id)===t.a.id),b=all.filter(p=>String(p.team_id)===t.b.id);renderLineup('A',a);renderLineup('B',b);setText('countA',a.length+' PELAAJAA');setText('countB',b.length+' PELAAJAA');$('emptyA').classList.toggle('hidden',a.length>0);$('emptyB').classList.toggle('hidden',b.length>0);clearError()}catch(e){showError(e)}}
startVisibility('lineups',false);update();setInterval(update,refresh*1000);
</script>
<script>
/* Kokoonpanot keskelle ruutua. Oletusleveys 1200 px; pelaajanimet 17 px.
   Jos kumpi tahansa kokoonpano on pitkä, skaalataan KOKO grafiikkaa tasaisesti
   niin, että kaikki pelaajarivit mahtuvat selainlähteeseen. */
(function applyLineupDimensions(){
  const params=new URLSearchParams(window.location.search);
  const stage=document.querySelector('.stage');
  if(!stage)return;
  const clamp=(n,min,max)=>Math.max(min,Math.min(max,n));
  const read=(key,fallback,min,max)=>{
    if(!params.has(key))return fallback;
    const raw=String(params.get(key)||'').trim();
    const n=Number(raw);
    return raw!==''&&Number.isFinite(n)&&n>0?clamp(n,min,max):fallback;
  };
  const baseWidth=read('width',1200,240,2400);
  const requestedHeight=read('height',null,40,2160);
  const preferredScale=read('scale',1,0.5,2.5);
  const offsetXRaw=String(params.get('offsetX')||'').trim();
  const offsetYRaw=String(params.get('offsetY')||'').trim();
  const offsetX=offsetXRaw!==''&&Number.isFinite(Number(offsetXRaw))?Number(offsetXRaw):0;
  const offsetY=offsetYRaw!==''&&Number.isFinite(Number(offsetYRaw))?Number(offsetYRaw):0;
  const root=document.documentElement;
  root.style.setProperty('--gfx-width',baseWidth+'px');
  root.style.setProperty('--offset-x',offsetX+'px');
  root.style.setProperty('--offset-y',offsetY+'px');
  stage.style.width=baseWidth+'px';
  stage.style.maxWidth='none';

  let debugBox=null;
  if(params.get('debug')==='1'){
    debugBox=document.createElement('div');
    debugBox.style.cssText='position:fixed;right:8px;bottom:8px;z-index:2147483647;background:rgba(16,24,32,.96);border:1px solid #e8c547;color:#fff;padding:7px 9px;font:12px/1.45 Arial,sans-serif;pointer-events:none;white-space:pre-line';
    document.body.appendChild(debugBox);
  }
  let scheduled=false;
  function scheduleFit(){
    if(scheduled)return;
    scheduled=true;
    requestAnimationFrame(()=>{scheduled=false;fit()});
  }
  function fit(){
    /* scrollHeight includes all player rows, even if their total exceeds viewport height. */
    const w=Math.max(stage.offsetWidth,stage.scrollWidth);
    const h=Math.max(stage.offsetHeight,stage.scrollHeight);
    if(!w||!h)return;
    const yFactor=requestedHeight===null?1:requestedHeight/h;
    const desiredW=w*preferredScale;
    const desiredH=h*preferredScale*yFactor;
    const availableW=Math.max(1,window.innerWidth-32-Math.abs(offsetX)*2);
    const availableH=Math.max(1,window.innerHeight-32-Math.abs(offsetY)*2);
    /* Fit only by shrinking; never enlarge automatically. Same additional factor
       is applied to both axes so the graphic's original proportions are preserved. */
    const autoFit=Math.max(0.001,Math.min(1,availableW/desiredW,availableH/desiredH));
    const sx=preferredScale*autoFit;
    const sy=preferredScale*yFactor*autoFit;
    root.style.setProperty('--scale',String(sx));
    root.style.setProperty('--scale-y',String(sy));
    if(debugBox){
      const r=stage.getBoundingClientRect();
      debugBox.textContent='KOKOONPANOT / AUTOSOVITUS\nLeveys: '+baseWidth+' px\nSisällön korkeus: '+Math.round(h)+' px\nAutomaattinen sovitus: '+autoFit.toFixed(3)+'\nSkaala: '+sx.toFixed(3)+' × '+sy.toFixed(3)+'\nNäkyvä koko: '+Math.round(r.width)+' × '+Math.round(r.height)+' px';
    }
  }
  if('ResizeObserver'in window){
    const ro=new ResizeObserver(scheduleFit);
    ro.observe(stage);
  }
  /* Also catches replacement of player rows after each API refresh. */
  if('MutationObserver'in window){
    const mo=new MutationObserver(scheduleFit);
    mo.observe(stage,{childList:true,subtree:true,characterData:true});
  }
  window.addEventListener('resize',scheduleFit);
  window.addEventListener('orientationchange',scheduleFit);
  if(window.visualViewport)window.visualViewport.addEventListener('resize',scheduleFit);
  requestAnimationFrame(scheduleFit);
})();
</script>
</body></html>

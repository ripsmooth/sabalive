<!doctype html><html lang="fi"><head>
<script src="github-pages-api.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Salibandy · Tulostaulu – vaihtoehto 2</title><style>

:root{--ink:#101820;--panel:#1b2a35;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1;--gfx-width:1400px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.gfx{opacity:1;transition:none;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
body.gfx-hidden .gfx{opacity:0;pointer-events:none}
.hidden{display:none!important}
.err{position:fixed;left:8px;bottom:8px;background:rgba(16,24,32,.96);border-left:4px solid var(--accent);padding:10px 14px;color:#fff;font-size:14px;max-width:calc(100vw - 16px)}
.logo{object-fit:contain;display:block}
.fallback{display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:50%;color:var(--accent);font-weight:900;background:var(--ink);flex:0 0 auto}

:root{--score-width:575px}
.stage{position:fixed;left:var(--offset-x);top:var(--offset-y);width:var(--score-width);max-width:calc(100vw - 12px);margin:0;transform:scale(var(--scale), var(--scale-y, var(--scale)));transform-origin:top left}
.scorebug{width:100%;height:54px;display:grid;grid-template-columns:minmax(0,1fr) 106px minmax(0,1fr) 70px;background:var(--ink);overflow:hidden}
.team{min-width:0;display:flex;align-items:center;gap:7px;padding:4px 7px;background:#141d25}
/* Vierasjoukkue: nimi ensin, logo aivan oman lohkon oikeaan reunaan. */
.team.b{flex-direction:row;justify-content:flex-end;text-align:right}
.logo{width:45px;height:45px;flex:0 0 45px}
.fallback{width:45px;height:45px;font-size:15px}
.team-name{font-size:15px;font-weight:900;line-height:1.05;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.score{background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900;white-space:nowrap;clip-path:polygon(10% 0,100% 0,90% 100%,0 100%);margin:0 -1px}
.clock{background:#1b2a35;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;white-space:nowrap;padding:0 3px}
.error{position:fixed;left:6px;top:64px}
.debug-panel{position:fixed;right:8px;bottom:8px;z-index:99999;max-width:min(440px,calc(100vw - 16px));max-height:45vh;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;background:rgba(16,24,32,.96);border-left:4px solid var(--accent);padding:9px 11px;color:#fff;font:11px/1.4 Consolas,Monaco,monospace;pointer-events:none;box-shadow:0 3px 12px rgba(0,0,0,.35)}
/* Tapahtumat tulostaulun alla */
.events{width:100%;display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.event-row{width:100%;min-height:54px;display:grid;grid-template-columns:96px minmax(0,1fr) 44px;align-items:stretch;overflow:hidden;border-radius:6px;background:#fff;color:#101820;box-shadow:0 2px 7px rgba(0,0,0,.16);animation:eventIn .18s ease-out;}
.event-time{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#00e5ee;color:#101820;font-size:15px;font-weight:900;line-height:1.15;text-align:center;padding:5px 3px;}
.event-row.penalty .event-time{background:#111;color:#fff;}
.event-main{min-width:0;display:flex;flex-direction:column;justify-content:center;padding:7px 10px;line-height:1.15;}
.event-player{font-size:14px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-detail{font-size:11px;font-weight:700;color:#303943;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.event-mark{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;writing-mode:vertical-rl;transform:rotate(180deg);letter-spacing:.4px;color:#4b5563;}
.event-row.penalty .event-mark{color:#111;}

@media(max-width:480px){.event-row{grid-template-columns:72px minmax(0,1fr) 30px;min-height:48px}.event-time{font-size:12px}.event-player{font-size:12px}.event-detail{font-size:10px}.event-main{padding:5px 7px}}

.scorebug{height:auto;display:flex;flex-direction:column;overflow:visible;background:transparent;gap:0}
.scorebug-main{width:100%;height:54px;display:grid;grid-template-columns:minmax(0,1fr) 106px minmax(0,1fr) 76px;background:var(--ink);overflow:hidden}

.period-badge{display:block;color:var(--ink);background:var(--accent);border-radius:2px;font-size:9px;font-weight:900;line-height:1.15;padding:2px 5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
/* Vaihtoehto 2: jäähyt ovat kelluvia ilmoituslaatikoita tulostaulun yläpuolella.
   Ne eivät lisää tulostaulun korkeutta eivätkä siirrä alla olevaa tapahtumalaatikkoa. */
.scorebug{position:relative}
.penalty-floater{position:absolute;left:0;right:0;bottom:calc(100% + 4px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:end;gap:7px;z-index:20;pointer-events:none}

.penalty-popup.active{display:flex}
/* Koti alkaa täsmälleen tulostaulun vasemmasta reunasta ja vieras päättyy oikeaan reunaan. */
.penalty-popup.home{justify-self:start;grid-column:1}
.penalty-popup.away{justify-self:end;grid-column:2}
.penalty-group{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden}
.penalty-chip{display:inline-flex;align-items:center;gap:4px;background:transparent;color:var(--accent);border:0;padding:0;font-size:11px;line-height:1.15;font-weight:900;white-space:nowrap;flex:0 0 auto}
.penalty-empty{display:none}
.layout-option2 .penalty-home{justify-content:flex-start}
.layout-option2 .penalty-away{justify-content:flex-end}
.layout-option4 .penalty-home{justify-content:flex-start;padding-left:3px}
.layout-option4 .penalty-away{justify-content:flex-end;padding-right:3px}
.layout-option4 .clock-box{flex-direction:row;gap:4px}
.layout-option4 .clock-box .clock{font-size:15px}
.layout-option4 .period-badge{font-size:9px;padding:3px 4px}
@media(max-width:480px){
 .scorebug-main{grid-template-columns:minmax(0,1fr) 78px minmax(0,1fr) 76px;height:48px}
 .scorebug-main .team{gap:4px;padding:3px}
 .scorebug-main .logo,.scorebug-main .fallback{width:34px;height:34px;flex-basis:34px}
 .scorebug-main .team-name{font-size:12px}

}

/* Vaihtoehto 2: suurennukset, vain tässä layoutissa. Jäähylaatikot kasvavat 25 % ankkuroituna reunoihin. */
.layout-option2 .penalty-popup.home{transform:scale(1.25);transform-origin:left bottom}

.layout-option2 .penalty-popup.away{margin-right:83px}

@media(max-width:480px){
 .layout-option2 .clock-box .clock{font-size:16.25px}
 .layout-option2 .period-badge{font-size:10px;padding:3px 4px}
}

<script>
const q=new URLSearchParams(location.search);
let matchId=q.get('match_id')||q.get('ottelu')||q.get('match')||'';
let defaultMatchPromise=null;
async function ensureMatchId(){if(matchId)return matchId;if(!defaultMatchPromise)defaultMatchPromise=fetch('/api/salibandy-default-match',{cache:'no-store'}).then(r=>r.json()).then(d=>{matchId=String(d.match_id||'953141');return matchId}).catch(()=>{matchId='953141';return matchId});return defaultMatchPromise;}
const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||3)));
// Eränäyttö: sekä ?clock=period että ?clockmode=period ovat tuettuja.
// Erä tulee ensisijaisesti suoraan virallisen TorneoPal-rajapinnan live_period-kentästä.
const clockMode=String(q.get('clockmode')||q.get('clock')||'clock').toLowerCase();
const requestedPeriod=String(q.get('period')||'').trim().toUpperCase();
function normalizePeriod(value){
 const v=String(value??'').trim().toUpperCase().replace(/\.$/,'');
 if(!v)return '';
 if(['JA','OT','OVERTIME','JATKOAIKA'].includes(v))return 'JA';
 if(['RL','PENALTIES','SHOOTOUT','RANGAISTUSLAUKAUKSET'].includes(v))return 'RL';
 const n=v.match(/^(?:(?:ERÄ|PERIOD|PERIODI)\s*)?([1-3])(?:\.?\s*ERÄ)?$/);
 if(n)return n[1]+'. ERÄ';

}
function periodLabel(m){
 // Explicit period=1/2/3/JA/RL is an optional operator override.
 if(requestedPeriod)return normalizePeriod(requestedPeriod)||requestedPeriod;
 const raw=m.live_period??m.period??m.period_no??m.period_number??m.current_period??m.live_period_name??m.period_name??'';
 const rawText=String(raw??'').trim();
 const named=normalizePeriod(rawText);
 if(named)return named;
 const n=Number(rawText);
 if(!Number.isInteger(n)||n<1)return ''; // -1/empty means no active period reported by the API.
 const regularCount=Number.parseInt(m.period_count,10)||3;
 const extraCount=Math.max(0,Number.parseInt(m.extra_period_count,10)||0);
 if(n<=regularCount)return n+'. ERÄ';
 if(n<=regularCount+extraCount)return 'JA';
 // Jos API ei ilmoita extra_period_count-arvoa, ensimmäinen varsinainen jatkoaikajakso on silti JA.
 if(n===regularCount+1)return 'JA';
 // Myöhempi numeerinen jakso tulkitaan rangaistuslaukauskilpailuksi; tekstimuotoinen RL käsitellään yllä.
 if(n>regularCount+extraCount)return 'RL';
 return '';
}
const offsetX=q.has('offsetX')&&String(q.get('offsetX')).trim()!==''&&Number.isFinite(Number(q.get('offsetX')))?Number(q.get('offsetX')):40;
const offsetY=q.has('offsetY')&&String(q.get('offsetY')).trim()!==''&&Number.isFinite(Number(q.get('offsetY')))?Number(q.get('offsetY')):45;
const scale=Math.max(.5,Math.min(2.5,Number(q.get('scale')||1)));
const width=Math.max(500,Math.min(1920,Number(q.get('width')||1400)));
document.documentElement.style.setProperty('--offset-x',offsetX+'px');
document.documentElement.style.setProperty('--offset-y',offsetY+'px');
// Apply coordinates directly as well, so the position does not depend on CSS variable resolution.
const scoreStage=document.querySelector('.stage');
if(scoreStage){scoreStage.style.left=offsetX+'px';scoreStage.style.top=offsetY+'px';}
document.documentElement.style.setProperty('--scale',scale);
document.documentElement.style.setProperty('--gfx-width',width+'px');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const delaySeconds=Math.max(0,Math.min(300,Number(q.get('delay')||0)||0));
const delayMs=delaySeconds*1000;
const delayStoragePrefix=kind=>'sabalive-scoreboard-delay-v1:'+String(matchId||'default')+':'+delaySeconds+':'+kind;
function readDelayQueue(kind){
 try{const v=JSON.parse(localStorage.getItem(delayStoragePrefix(kind))||'[]');return Array.isArray(v)?v.filter(x=>x&&Number.isFinite(x.at)&&x.data):[];}catch{return []}
}
function writeDelayQueue(kind,queue){
 try{localStorage.setItem(delayStoragePrefix(kind),JSON.stringify(queue.slice(-600)));}catch{}
}
function enqueueAndRelease(kind,data){
 if(delayMs<=0)return [data];
 const now=Date.now(),queue=readDelayQueue(kind);
 queue.push({at:now,data});
 const cutoff=now-delayMs;
 const ready=[],pending=[];
 for(const item of queue){if(item.at<=cutoff)ready.push(item.data);else pending.push(item);}
 writeDelayQueue(kind,pending);
 return ready;
}
let latestLiveScore=null;let lastScoreFetchMetrics=null;let lastMatchFetchMetrics=null;let liveUpdateInFlight=false;
async function getMatch(){
 await ensureMatchId();const u=new URL('/api/salibandy-match',location.origin);u.searchParams.set('match_id',matchId);u.searchParams.set('timeStamp',Date.now());
 const startedAt=Date.now(),t0=performance.now();
 try{const r=await fetch(u,{cache:'no-store'});const d=await r.json();const receivedAt=Date.now();lastMatchFetchMetrics={requestedAt:new Date(startedAt).toISOString(),receivedAt:new Date(receivedAt).toISOString(),roundTripMs:Math.round(performance.now()-t0),httpStatus:r.status,sourceLastModified:d?.match?.last_modified??d?.match?.modified??null,liveA:d?.match?.live_A??null,liveB:d?.match?.live_B??null,fsA:d?.match?.fs_A??null,fsB:d?.match?.fs_B??null};if(!r.ok)throw Error(d?.error||('API vastasi '+r.status));if(d.call?.status&&d.call.status!=='ok')throw Error('TorneoPal: '+d.call.status);if(!d.match)throw Error('Ottelutietoja ei löytynyt.');updateDebugPanel();return d.match}
 catch(e){lastMatchFetchMetrics={requestedAt:new Date(startedAt).toISOString(),receivedAt:new Date().toISOString(),roundTripMs:Math.round(performance.now()-t0),error:e?.message||String(e)};updateDebugPanel();throw e}
}
async function getLiveScore(){
 await ensureMatchId();const u=new URL('/api/salibandy-score',location.origin);u.searchParams.set('match_id',matchId);
 const startedAt=Date.now(),t0=performance.now();
 try{const r=await fetch(u,{cache:'no-store'});const d=await r.json();const receivedAt=Date.now();lastScoreFetchMetrics={requestedAt:new Date(startedAt).toISOString(),receivedAt:new Date(receivedAt).toISOString(),roundTripMs:Math.round(performance.now()-t0),serverRoundTripMs:d?._sabalive?.elapsedMs??null,httpStatus:r.status,sourceLastModified:d?.score?.last_modified??null,liveA:d?.score?.live_A??null,liveB:d?.score?.live_B??null,fsA:d?.score?.fs_A??null,fsB:d?.score?.fs_B??null,status:d?.score?.status??null,timerOn:d?.score?.live_timer_on??null};if(!r.ok)throw Error(d?.error||('Live-tulos API vastasi '+r.status));if(d.call?.status&&d.call.status!=='ok')throw Error('TorneoPal getScore: '+d.call.status);if(!d.score)throw Error('getScore-vastauksesta puuttuu tulostieto.');updateDebugPanel();return d.score}
 catch(e){lastScoreFetchMetrics={requestedAt:new Date(startedAt).toISOString(),receivedAt:new Date().toISOString(),roundTripMs:Math.round(performance.now()-t0),error:e?.message||String(e)};updateDebugPanel();throw e}
}
function updateDebugPanel(){
 const panel=$('debugPanel');if(!panel||q.get('debug')!=='1')return;panel.classList.remove('hidden');
 const fmt=v=>v===null||v===undefined||v===''?'—':String(v);const s=lastScoreFetchMetrics||{},m=lastMatchFetchMetrics||{};const shown=acceptedScore||{a:'—',b:'—'};
 const age=ts=>{if(!ts)return '—';const d=Date.parse(String(ts).replace(' ','T'));return Number.isFinite(d)?Math.round((Date.now()-d)/1000)+' s sitten (palvelimen aikavyöhyke voi vaikuttaa)':'—'};
 panel.textContent='SABALIVE LIVE-DIAGNOSTIIKKA\nOttelu: '+fmt(matchId)+'\nNäytetty tulos: '+shown.a+' – '+shown.b+'\n\ngetScore (nopea)\nHTTP: '+fmt(s.httpStatus)+' · selainpyyntö: '+fmt(s.roundTripMs)+' ms · palvelinpyyntö: '+fmt(s.serverRoundTripMs)+' ms\nVastaanotettu: '+fmt(s.receivedAt)+'\nLähteen last_modified: '+fmt(s.sourceLastModified)+' · '+age(s.sourceLastModified)+'\nLive-tulos: '+fmt(s.liveA)+' – '+fmt(s.liveB)+' · tila: '+fmt(s.status)+' · kello käy: '+fmt(s.timerOn)+'\nVirhe: '+fmt(s.error)+'\n\ngetMatch (yksityiskohdat)\nHTTP: '+fmt(m.httpStatus)+' · selainpyyntö: '+fmt(m.roundTripMs)+' ms\nVastaanotettu: '+fmt(m.receivedAt)+'\nLähteen last_modified: '+fmt(m.sourceLastModified)+'\nLive/fs: '+fmt(m.liveA)+'–'+fmt(m.liveB)+' / '+fmt(m.fsA)+'–'+fmt(m.fsB)+'\nVirhe: '+fmt(m.error)+'\n\nViive: '+delaySeconds+' s · Live-kyselyväli: '+scoreRefresh+' s · yksityiskohtien väli: '+refresh+' s';
}


function updatePeriodBadge(m){
 const badge=$('periodBadge');
 if(!badge)return;
 if(clockMode==='period'){badge.classList.add('hidden');return}
 badge.classList.remove('hidden');
 badge.textContent=periodLabel(m)||'—';
}
let penaltySourceMatch=null;
function parsePenaltyTime(value){
 if(value===null||value===undefined||value==='')return null;
 const s=String(value).trim();
 if(/^\d{1,3}:\d{2}:\d{2}$/.test(s)||/^\d{1,3}:\d{2}$/.test(s))return parseClockSeconds(s);
 if(/^\d+$/.test(s))return Number(s);

 return m?Math.round(Number(m[1])*60):null;
}
function currentPeriodClockSeconds(m){
 if(clockBaseSeconds!==null)return Math.max(0,Math.floor(clockBaseSeconds+(clockIsRunning?(Date.now()-clockReceivedAt)/1000:0)));

}
function periodLengthSeconds(m, periodIndex){
 const lengths=m?.period_lengths_sec;
 if(Array.isArray(lengths)&&lengths.length){
  const raw=lengths[periodIndex-1];

  if(Number.isFinite(n)&&n>0)return n;
 }
 if(lengths&&typeof lengths==='object'){
  const raw=lengths[periodIndex]??lengths[String(periodIndex)]??lengths['p'+periodIndex]??lengths['p'+(periodIndex-1)];
  const n=Number(raw);
  if(Number.isFinite(n)&&n>0)return n;
 }
 const regularCount=Math.max(1,Number.parseInt(m?.period_count,10)||3);
 const normalMin=Number(m?.period_min??m?.period_length_min??m?.period_minutes);
 const overtimeMin=Number(m?.extra_period_min??m?.extra_period_length_min);
 const mins=periodIndex>regularCount?(Number.isFinite(overtimeMin)&&overtimeMin>0?overtimeMin:(Number.isFinite(normalMin)&&normalMin>0?normalMin:20)):(Number.isFinite(normalMin)&&normalMin>0?normalMin:20);
 return Math.round(mins*60);
}
function periodStartOffsetSeconds(m, periodIndex){
 let offset=0;
 for(let i=1;i<periodIndex;i++)offset+=periodLengthSeconds(m,i);
 return offset;
}
function currentMatchElapsedSeconds(m){
 const source=latestLiveScore||m;
 const periodRaw=source?.live_period??source?.period??source?.period_no??source?.period_number??1;
 const periodIndex=Math.max(1,Number.parseInt(periodRaw,10)||1);
 const localClock=currentPeriodClockSeconds(source);
 if(localClock===null)return null;
 return periodStartOffsetSeconds(m||source,periodIndex)+localClock;
}
function penaltyStartMatchSeconds(startSeconds,p,m){
 const periodRaw=p?.period??p?.period_no??p?.period_number??p?.live_period??latestLiveScore?.live_period??m?.live_period??1;
 const periodIndex=Math.max(1,Number.parseInt(periodRaw,10)||1);
 const currentLocalPeriodLength=periodLengthSeconds(m,periodIndex);
 // TorneoPal's event time can be cumulative (e.g. 25:02 in period 2) or local
 // to the period (e.g. 05:02 in period 2). For later periods, values at or beyond
 // the duration of one period are treated as cumulative; shorter values as local.
 if(periodIndex>1&&startSeconds>=currentLocalPeriodLength)return startSeconds;
 return periodStartOffsetSeconds(m,periodIndex)+startSeconds;
}
function penaltyRemainingSeconds(p, m){
 const directKeys=['remaining_seconds','seconds_remaining','time_remaining_seconds','penalty_seconds_remaining','live_remaining_seconds'];
 for(const key of directKeys){const n=Number(p?.[key]);if(p?.[key]!==undefined&&p?.[key]!==null&&p[key]!==''&&Number.isFinite(n))return Math.max(0,Math.floor(n))}
 const directTextKeys=['remaining_time','time_remaining','time_left','penalty_time_left','remaining_penalty_time'];

<script>
/* URL-kohtainen koon hienosäätö: width= ja height= ovat pikseleitä ennen yleistä scale-kerrointa. */
(function applyManualDimensions(){
  const sizeParams = new URLSearchParams(window.location.search);
  const sizeStage = document.querySelector('.stage');
  if (!sizeStage) return;
  const defaultWidth = 575;
  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const queryNumber = (key, fallback, min, max) => {
    if (!sizeParams.has(key)) return fallback;
    const n = Number(sizeParams.get(key));
    return Number.isFinite(n) && n > 0 ? clamp(n, min, max) : fallback;
  };
  const targetWidth = queryNumber('width', defaultWidth, 240, 2400);
  const requestedHeight = sizeParams.has('height') ? queryNumber('height', null, 40, 2160) : null;
  const overallScale = queryNumber('scale', 1, 0.5, 2.5);
  const root = document.documentElement;
  root.style.setProperty('--scale', String(overallScale));
  root.style.setProperty('--gfx-width', targetWidth + 'px');
  root.style.setProperty('--score-width', targetWidth + 'px');
  /* Inline-arvot voittavat vanhat sivukohtaiset max-width/width-säännöt. */
  sizeStage.style.width = targetWidth + 'px';
  sizeStage.style.maxWidth = 'none';

  let debugBox = null;
  if (sizeParams.get('debug') === '1') {
    debugBox = document.createElement('div');
    debugBox.style.cssText = 'position:fixed;right:8px;bottom:8px;z-index:2147483647;background:rgba(16,24,32,.96);border:1px solid #e8c547;color:#fff;padding:7px 9px;font:12px/1.45 Arial,sans-serif;pointer-events:none;white-space:pre-line';
    document.body.appendChild(debugBox);
  }
  function updateSize(){
    const naturalHeight = sizeStage.offsetHeight;
    if (!naturalHeight) return;
    const verticalFit = requestedHeight === null ? 1 : requestedHeight / naturalHeight;
    root.style.setProperty('--scale-y', String(overallScale * verticalFit));
    if (debugBox) {
      const r = sizeStage.getBoundingClientRect();
      debugBox.textContent = 'KOKOSÄÄDÖT\nwidth=' + targetWidth + ' px\nheight=' + (requestedHeight === null ? 'auto (' + Math.round(naturalHeight) + ' px)' : requestedHeight + ' px') + '\nscale=' + overallScale + '\nNäkyvä laatikko: ' + Math.round(r.width) + ' × ' + Math.round(r.height) + ' px' + (window.__salibandyScoreDebug ? '\n\n' + window.__salibandyScoreDebug() : '');
    }
  }
  /* Sisältökorkeus voi muuttua, kun pelaajat/tapahtumat päivittyvät. */
  if ('ResizeObserver' in window) {
    const ro = new ResizeObserver(() => requestAnimationFrame(updateSize));
    ro.observe(sizeStage);
  }
  window.addEventListener('resize', updateSize);
  requestAnimationFrame(updateSize);
  if (debugBox) window.setInterval(updateSize, 1000);
})();
</script>

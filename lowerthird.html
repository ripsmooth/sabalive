<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TorneoPal • Lower Third</title>
<style>
:root{--ink:#101820;--panel:#17232e;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--scale:1;--lt-width:1400px;--lt-height:300px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.stage{position:absolute;left:50%;bottom:50px;width:var(--lt-width);height:auto;max-width:calc(100vw - 16px);transform:translateX(-50%) scale(var(--scale));transform-origin:bottom center;padding:8px;display:flex;flex-direction:column;gap:0;filter:drop-shadow(0 4px 8px rgba(0,0,0,.32))}
.top{background:var(--accent);height:calc((var(--lt-height) - 16px) * .5845);min-height:170px;display:grid;grid-template-columns:minmax(0,1fr) 310px minmax(0,1fr);align-items:stretch}
.team{min-width:0;background:rgba(16,24,32,.97);display:flex;align-items:center;gap:22px;padding:20px 30px}
.team.home{clip-path:polygon(0 0,100% 0,calc(100% - 22px) 100%,0 100%)}
.team.away{clip-path:polygon(22px 0,100% 0,100% 100%,0 100%);flex-direction:row-reverse;text-align:right}
.logo{width:108px;height:108px;flex:0 0 108px;object-fit:contain}
.fallback{width:108px;height:108px;flex:0 0 108px;border:2px solid rgba(255,255,255,.5);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:28px;font-weight:900}
.teamname{font-size:clamp(22px,2.1vw,38px);line-height:1.05;font-weight:900;text-transform:uppercase;overflow-wrap:anywhere;max-height:2.2em;overflow:hidden}
.center{background:var(--accent);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:1;padding:14px 12px}
.score{font-size:64px;line-height:1;font-weight:900;display:flex;gap:17px;align-items:center;white-space:nowrap}.dash{font-size:44px;font-weight:700}
.clock{font-size:23px;line-height:1.1;font-weight:900;letter-spacing:.04em;text-align:center}.period{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;text-align:center;opacity:.82}
.scorers{height:auto;display:grid;grid-template-columns:1fr 1fr;background:rgba(16,24,32,.96);border-top:4px solid var(--accent);overflow:visible}
.scorer-col{padding:10px 26px 12px;min-width:0;overflow:visible}.scorer-col.home{border-right:1px solid rgba(255,255,255,.2)}
.col-title{font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.goal-list{display:flex;flex-direction:column;gap:3px;overflow:visible;max-height:none}.goal{display:grid;grid-template-columns:minmax(0,1fr) 50px;gap:9px;align-items:center;font-size:17px;line-height:1.2;min-height:20px}.goal-times{font-weight:900;color:var(--accent);white-space:nowrap;margin-right:8px}.goal-player{font-weight:800;white-space:normal;overflow-wrap:anywhere}.goal-time{font-weight:900;color:var(--accent);white-space:nowrap}.goal-player{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.goal-number{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}.no-goals{font-size:14px;color:var(--muted);font-style:italic;padding:5px 0}
#stage{opacity:1;transition:opacity .45s ease-in-out;will-change:opacity}.graphics-off #stage{opacity:0;pointer-events:none}.graphics-off #err{display:none!important}.err{position:absolute;left:8px;top:8px;max-width:700px;background:rgba(16,24,32,.97);border-left:5px solid var(--accent);padding:13px 16px;font-size:16px}.hidden{display:none!important}
@media(max-width:800px){.stage{width:calc(100vw - 16px);max-width:calc(100vw - 16px)}.top{grid-template-columns:minmax(0,1fr) 190px minmax(0,1fr);height:145px;min-height:145px}.team{gap:10px;padding:12px}.logo,.fallback{width:64px;height:64px;flex-basis:64px}.teamname{font-size:clamp(15px,2.5vw,25px)}.score{font-size:44px;gap:9px}.dash{font-size:28px}.clock{font-size:17px}.period{font-size:10px}.scorers{height:auto}.scorer-col{padding:8px 12px 10px}.goal{grid-template-columns:minmax(0,1fr) 34px;font-size:13px;gap:5px}.goal-times{margin-right:5px}.goal-number{font-size:11px}}
</style>
</head>
<body>
<div class="stage" id="stage">
 <div class="top">
  <div class="team home"><div id="homeLogo" class="fallback">K</div><div class="teamname" id="homeName">KOTIJOUKKUE</div></div>
  <div class="center"><div class="score"><span id="homeScore">0</span><span class="dash">–</span><span id="awayScore">0</span></div><div class="clock" id="clock">—</div><div class="period" id="period">OTTELU</div></div>
  <div class="team away"><div id="awayLogo" class="fallback">V</div><div class="teamname" id="awayName">VIERASJOUKKUE</div></div>
 </div>
 <div class="scorers">
  <div class="scorer-col home"><div class="col-title" id="homeTitle">KOTIJOUKKUEEN MAALIT</div><div class="goal-list" id="homeGoals"><div class="no-goals">Ei maaleja</div></div></div>
  <div class="scorer-col away"><div class="col-title" id="awayTitle">VIERASJOUKKUEEN MAALIT</div><div class="goal-list" id="awayGoals"><div class="no-goals">Ei maaleja</div></div></div>
 </div>
</div><div class="err" id="err">TorneoPal: haetaan ottelutietoja…</div>
<script>
(()=>{
 const q=new URLSearchParams(location.search);
 const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 let date=q.get('pvm')||localDate,tournament=q.get('turnaus')||'sjpl_2627',matchId=q.get('ottelu')||q.get('match')||'';const explicitMatch=!!matchId;
 const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||5)));
 const width=Math.max(900,Math.min(1920,parseInt(q.get('width')||'1400',10)||1400));
 const height=Math.max(220,Math.min(500,parseInt(q.get('height')||'300',10)||300));
 const scale=Math.max(.5,Math.min(2.5,Number(q.get('scale')||1)));
 document.documentElement.style.setProperty('--lt-width',width+'px');document.documentElement.style.setProperty('--lt-height',height+'px');document.documentElement.style.setProperty('--scale',scale);
 const $=id=>document.getElementById(id),val=(n,t)=>(n.getElementsByTagName(t)[0]?.textContent||'').trim();
 function attr(n,k){return(n.getAttribute(k)||'').trim()}
 function set(id,v){$(id).textContent=v==null?'':String(v)}
 function logo(id,url,name){const el=$(id);el.innerHTML='';if(url&&/^https?:\/\//i.test(url)){const im=document.createElement('img');im.className='logo';im.alt='';im.src=url;im.onerror=()=>{el.className='fallback';el.textContent=(name||'?').slice(0,2).toUpperCase()};el.className='';el.appendChild(im)}else{el.className='fallback';el.textContent=(name||'?').slice(0,2).toUpperCase()}}
 function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
 function seconds(s){const p=String(s||'').split(':').map(x=>parseInt(x,10)||0);return p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0]||0}
 function goalsFor(m,side){return [...m.getElementsByTagName('tapahtuma')].filter(e=>attr(e,'tapahtuma')==='maali'&&['koti','vieras'].includes(attr(e,'kvjoukkue'))&&attr(e,'kvjoukkue')===side).map((e,i)=>({clock:attr(e,'kulunutaika')||attr(e,'aika')||'—',seconds:seconds(attr(e,'kulunutaika')||attr(e,'aika')),player:attr(e,'pelaajanimi')||'Tuntematon maalintekijä',number:attr(e,'pelaajanro'),id:attr(e,'poytakirjatapahtumaid'),order:i})).sort((a,b)=>a.seconds-b.seconds||a.order-b.order)}
 function formatGoalTime(clock){const t=String(clock||'').replace(/\s/g,'');return t.replace(/(\d+)(?::00)$/,(_,minute)=>String(Number(minute))+"'")}
 function drawGoals(id,goals){const el=$(id);if(!goals.length){el.innerHTML='<div class="no-goals">Ei maaleja</div>';return}const grouped=new Map();for(const g of goals){const key=(g.player||'Tuntematon maalintekijä').trim().toLocaleLowerCase('fi');if(!grouped.has(key))grouped.set(key,{player:g.player||'Tuntematon maalintekijä',number:g.number,goals:[]});grouped.get(key).goals.push(g)}el.innerHTML=[...grouped.values()].map(p=>'<div class="goal"><span class="goal-player"><span class="goal-times">'+p.goals.map(g=>esc(formatGoalTime(g.clock))).join(', ')+'</span>'+esc(p.player)+'</span><span class="goal-number">'+(p.number?'#'+esc(p.number):'')+'</span></div>').join('')}
 function fail(msg){set('err','TorneoPal: '+msg);$('err').classList.remove('hidden')}
 function render(xml){const d=new DOMParser().parseFromString(xml,'application/xml');if(d.querySelector('parsererror'))throw Error('XML-dataa ei voitu lukea.');const matches=[...d.getElementsByTagName('ottelu')];if(!matches.length)throw Error('Otteluita ei löytynyt valitulta päivältä.');let m=matchId?matches.find(x=>val(x,'otteluid')===matchId):null;if(matchId&&!m)throw Error('Ottelua '+matchId+' ei löytynyt.');if(!m)m=matches.find(x=>{const s=val(x,'livestatus').toLowerCase();return s&&!['over','played','finished','ended'].includes(s)})||matches[0];
 const hn=val(m,'kotinimi')||'KOTI',an=val(m,'vierasnimi')||'VIERAS';set('homeName',hn);set('awayName',an);set('homeTitle',hn+' · MAALIT');set('awayTitle',an+' · MAALIT');set('homeScore',val(m,'kmaali')||'0');set('awayScore',val(m,'vmaali')||'0');logo('homeLogo',val(m,'kotilogo'),hn);logo('awayLogo',val(m,'vieraslogo'),an);
 const raw=(val(m,'livestatus')||val(m,'status')).toLowerCase(),done=['over','played','finished','ended'].includes(raw),clock=val(m,'liveaika');set('clock',clock||(done?'LOPPUTULOS':'—'));const period=val(m,'livejakso');set('period',done?'LOPPUTULOS':period?(period+'. JAKSO'):(['live','playing'].includes(raw)?'LIVE':(val(m,'status')||'OTTELU')));
 drawGoals('homeGoals',goalsFor(m,'koti'));drawGoals('awayGoals',goalsFor(m,'vieras'));$('err').classList.add('hidden');
 }
 async function update(){try{const url=new URL('/api/live',location.origin);url.searchParams.set('pvm',date);url.searchParams.set('turnaus',tournament);const r=await fetch(q.get('api')||url.toString(),{cache:'no-store'});if(!r.ok)throw Error('palvelin vastasi '+r.status);render(await r.text())}catch(e){fail('tietoja ei saatu. '+e.message+' Tarkista Vercel-julkaisu ja TorneoPal-yhteys.')}}
 async function startWithDefault(){if(!explicitMatch){try{const r=await fetch('/api/default-match',{cache:'no-store'});if(r.ok){const d=await r.json();if(d.ottelu){matchId=String(d.ottelu);if(!q.has('pvm')&&d.pvm)date=d.pvm;if(!q.has('turnaus')&&d.turnaus)tournament=d.turnaus}}}catch(e){}}update();setInterval(update,refresh*1000)}startWithDefault();
 async function checkGraphicsVisibility(){
   try { const r=await fetch('/api/graphics-state',{cache:'no-store'}); if(!r.ok)return;
     const state=await r.json(); document.body.classList.toggle('graphics-off',state.lowerthird!==true);
   } catch(e) {}
 }
 checkGraphicsVisibility(); setInterval(checkGraphicsVisibility,2000);
})();
</script>
<script>
(function(){
 const params=new URLSearchParams(location.search); if(params.get('debug')!=='1') return;
 const targetSelector='#stage';
 const panel=document.createElement('div');
 panel.id='bandylive-debug-panel';
 panel.style.cssText='position:fixed;z-index:2147483647;left:8px;top:8px;max-width:min(460px,calc(100vw - 16px));max-height:45vh;overflow:auto;padding:10px 12px;background:rgba(5,10,15,.94);color:#fff;border:1px solid #e8c547;border-radius:6px;font:12px/1.45 Arial,sans-serif;box-shadow:0 4px 20px #0008;white-space:normal;pointer-events:auto';
 panel.innerHTML='<div style="display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:6px"><b style="color:#e8c547">BANDYLIVE DEBUG · KOKOTIEDOT</b><button id="bd-close" style="background:#e8c547;color:#101820;border:0;padding:3px 7px;font-weight:bold;cursor:pointer">Sulje</button></div><div id="bd-values"></div>';
 document.body.appendChild(panel); panel.querySelector('#bd-close').onclick=()=>panel.remove();
 const fmt=n=>Number.isFinite(n)?Math.round(n*100)/100:'—';
 function update(){if(!document.body.contains(panel))return;const el=document.querySelector(targetSelector);let rect=el?el.getBoundingClientRect():null;const cs=el?getComputedStyle(el):null;
 const rows=[['Grafiikkaelementti',targetSelector],['Elementti löytyi',el?'kyllä':'ei'],['Elementin koko',rect?fmt(rect.width)+' × '+fmt(rect.height)+' px':'—'],['Elementin sijainti',rect?'x '+fmt(rect.left)+' / y '+fmt(rect.top):'—'],['CSS width / height',cs?cs.width+' / '+cs.height:'—'],['Transform',cs?cs.transform:'—'],['Ikkuna',innerWidth+' × '+innerHeight+' px'],['Dokumentti',document.documentElement.scrollWidth+' × '+document.documentElement.scrollHeight+' px'],['Näyttökerroin',devicePixelRatio],['URL-parametrit',location.search||'(ei parametreja)']];
 panel.querySelector('#bd-values').innerHTML=rows.map(([k,v])=>'<div style="display:flex;justify-content:space-between;gap:12px;border-top:1px solid #ffffff20;padding:3px 0"><span style="color:#bdc7d0">'+k+'</span><b style="text-align:right;overflow-wrap:anywhere">'+String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</b></div>').join('');
 }
 update();window.addEventListener('resize',update);window.addEventListener('load',update);setInterval(update,1000);
})();
</script>
</body></html>

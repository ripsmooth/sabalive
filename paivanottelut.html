<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bandylive · Päivän ottelut</title>
<style>
:root{--ink:#101820;--panel:#17232e;--panel2:#111a22;--accent:#e8c547;--white:#fff;--muted:#bdc7d0;--blue:#a9c4df;--scale:1;--board-width:1050px}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif;color:var(--white);font-variant-numeric:tabular-nums}
.wrap{position:fixed;left:50%;top:30px;translate:-50% 0;width:var(--board-width);max-width:calc(100vw - 80px);transform:scale(calc(var(--scale) * 1.2));transform-origin:top center;filter:drop-shadow(0 3px 7px rgba(0,0,0,.26))}
.heading{height:42px;background:var(--accent);color:var(--ink);display:flex;align-items:center;justify-content:space-between;padding:0 15px;gap:16px;font-weight:900;text-transform:uppercase;letter-spacing:.07em}
.heading-title{font-size:17px;white-space:nowrap}.heading-meta{font-size:17px;letter-spacing:.07em;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
.matches{display:flex;flex-direction:column;gap:5px;margin-top:5px}
.match{background:rgba(16,24,32,.97);border-left:4px solid var(--accent);padding:9px 12px 8px;min-width:0}
.match-head{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:42px}
.team{display:flex;align-items:center;gap:9px;min-width:0;font-size:16px;font-weight:900;text-transform:uppercase;letter-spacing:.015em}
.team.away{justify-content:flex-end;text-align:right}
.team-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logo{width:34px;height:34px;object-fit:contain;flex:0 0 34px}
.fallback{width:34px;height:34px;flex:0 0 34px;display:flex;align-items:center;justify-content:center;border:1px solid #60717d;border-radius:50%;color:var(--accent);font-size:10px;font-weight:900}
.score{min-width:88px;text-align:center;color:var(--accent);font-size:25px;font-weight:900;line-height:1;white-space:nowrap}.score.kickoff{font-size:23px;letter-spacing:.03em}
.state{min-width:58px;text-align:right;color:var(--muted);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.state.live{color:var(--accent)}
.scorers{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid rgba(255,255,255,.13);margin-top:6px;padding-top:6px;min-height:21px}
.scorer-list{display:flex;flex-wrap:wrap;gap:3px 12px;min-width:0;color:#f2f5f7;font-size:12px;line-height:1.35}
.scorer-list.away{justify-content:flex-end;text-align:right}
.scorer{white-space:nowrap}.scorer-minute{color:var(--accent);font-weight:900;margin-left:4px}
.no-scorers{grid-column:1/-1;text-align:center;color:#8e9da8;font-size:10px;letter-spacing:.05em;text-transform:uppercase}
.missing{margin-top:6px;padding:7px 10px;background:rgba(232,197,71,.12);border-left:3px solid var(--accent);color:#fff;font-size:11px}
.error{padding:10px 12px;background:rgba(16,24,32,.96);border-left:4px solid var(--accent);color:#fff;font-size:12px;line-height:1.4}
.empty{padding:12px;background:rgba(16,24,32,.96);color:var(--muted);font-size:12px}
.footer{display:flex;justify-content:space-between;gap:12px;margin-top:4px;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:650px){.wrap{max-width:calc(100vw - 16px);left:50%;top:8px;translate:-50% 0}.heading{height:36px;padding:0 9px}.heading-title,.heading-meta{font-size:14px}.match{padding:7px 8px}.match-head{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px}.team{font-size:12px;gap:5px}.logo,.fallback{width:27px;height:27px;flex-basis:27px}.score{min-width:64px;font-size:20px}.score.kickoff{font-size:19px}.state{grid-column:1/-1;text-align:center;min-width:0;margin-top:-2px}.scorer-list{font-size:10px}}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="heading"><span class="heading-title">PÄIVÄN OTTELUT</span><span class="heading-meta" id="headingMeta">HAETAAN OTTELUITA…</span></div>
  <div class="matches" id="matches"></div>
  <div class="error hidden" id="error"></div>
  <div class="footer"><span id="tournamentLabel">BANDYLIVE · TORNEOPAL</span><span id="updated"></span></div>
</div>
<script>
(() => {
 const q=new URLSearchParams(location.search);
 const $=id=>document.getElementById(id);
 const localDate=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Helsinki',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
 const date=q.get('pvm')||localDate;
 const tournament=q.get('turnaus')||'sjpl_2627';
 const refresh=Math.max(3,Math.min(60,Number(q.get('refresh')||5)));
 const delaySeconds=Math.max(0,Math.min(300,Number.isFinite(Number(q.get('delay')))?Number(q.get('delay')):0));
 const delayMs=delaySeconds*1000;
 const scale=Math.max(.5,Math.min(2.5,Number(q.get('scale')||1)));
 const width=Math.max(600,Math.min(1600,parseInt(q.get('width')||'1050',10)||1050));
 document.documentElement.style.setProperty('--scale',scale);
 document.documentElement.style.setProperty('--board-width',width+'px');
 const rawIdValues=[...q.getAll('ottelu'),...q.getAll('ottelut'),...q.getAll('match'),...q.getAll('matches')];
 const requestedIds=[...new Set(rawIdValues.flatMap(v=>String(v).split(/[,;\s]+/)).map(v=>v.trim()).filter(v=>/^\d{1,12}$/.test(v)))];
 let requestSequence=0,lastRenderedSequence=0;
 const $matches=$('matches');
 const text=(node,tag)=>node.getElementsByTagName(tag)[0]?.textContent?.trim()||'';
 const attr=(node,name)=>String(node.getAttribute(name)||'').trim();
 const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const dateLabel=date.split('-').length===3?`${Number(date.slice(8,10))}.${Number(date.slice(5,7))}.${date.slice(0,4)}`:date;
 $('headingMeta').textContent=dateLabel;

 function parseClockSeconds(value){
  const s=String(value||'').trim();
  if(!s)return NaN;
  // TorneoPal can express added time as e.g. 45+00:09.
  const added=s.match(/^(\d+)\+(\d{1,2}):(\d{1,2})$/);
  if(added)return Number(added[1])*60+Number(added[2])*60+Number(added[3]);
  if(/^\d+\+\d+$/.test(s))return Number(s.split('+')[0])*60+Number(s.split('+')[1])*60;
  const p=s.split(':').map(n=>Number(n));
  if(p.some(n=>!Number.isFinite(n)))return NaN;
  if(p.length===3)return p[0]*3600+p[1]*60+p[2];
  if(p.length===2)return p[0]*60+p[1];
  if(p.length===1)return p[0]*60;
  return NaN;
 }
 function minuteLabel(event,match){
  let raw=attr(event,'kulunutaika')||attr(event,'peliaika');
  let seconds=parseClockSeconds(raw);
  if(!Number.isFinite(seconds)){
   raw=attr(event,'aika');seconds=parseClockSeconds(raw);
   const period=Math.max(1,Number(attr(event,'jakso'))||1);
   const periodMinutes=Math.max(1,Number(text(match,'eramin'))||45);
   if(Number.isFinite(seconds))seconds+=(period-1)*periodMinutes*60;
  }
  if(!Number.isFinite(seconds))return '';
  return Math.max(0,Math.ceil(seconds/60))+"'";
 }
 function currentMinute(match){
  const period=Math.max(1,Number(text(match,'livejakso'))||1);
  const perLen=Math.max(1,Number(text(match,'eramin'))||45);
  const raw=text(match,'liveaika')||text(match,'livekokaika');
  let seconds=parseClockSeconds(raw);
  if(!Number.isFinite(seconds))return '';
  const completed=(period-1)*perLen*60;
  if(period>1&&seconds<completed)seconds+=completed;
  return Math.ceil(seconds/60)+"'";
 }
 function statusFor(match){
  const live=(text(match,'livestatus')||'').toLowerCase();
  const status=(text(match,'status')||'').toLowerCase();
  if(['over','played','finished','ended'].includes(live)||['played','finished','ended'].includes(status))return {label:'LOPPUTULOS',live:false,phase:'finished'};
  if(['live','playing','inprogress','in_progress'].includes(live)||Number(text(match,'livejakso'))>0&&text(match,'kellokay')==='1'){
   const minute=currentMinute(match);return {label:minute?`LIVE · ${minute}`:'LIVE',live:true,phase:'live'};
  }
  if(live==='paused'||status.includes('pause'))return {label:'TAUKO',live:true,phase:'paused'};
  return {label:(text(match,'status')||'TULOSSA').toUpperCase(),live:false,phase:'upcoming'};
 }
 function startTime(match){
  // TorneoPalin eri näkymissä ottelun alkamisaika voi esiintyä eri kenttänimillä.
  const fields=['kellonaika','alkamisaika','alkuaika','ottelunalkamisaika','ottelunalku','ottelun_aika','otteluaika','otteluaika_klo','otteluklo','ottelu_klo','klo','aika','starttime','start_time','match_time','time'];
  let raw='';
  for(const field of fields){raw=text(match,field)||attr(match,field);if(raw)break;}
  if(!raw)return '';
  const matchTime=raw.match(/(?:^|[T ])(\d{1,2}):(\d{2})(?::\d{2})?/);
  if(matchTime){const hh=Number(matchTime[1]),mm=Number(matchTime[2]);if(hh>=0&&hh<=23&&mm>=0&&mm<=59)return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');}
  return '';
 }
 function goalSeconds(event,match){
  let secs=parseClockSeconds(attr(event,'kulunutaika')||attr(event,'peliaika'));
  if(!Number.isFinite(secs)){
   secs=parseClockSeconds(attr(event,'aika'));
   if(Number.isFinite(secs))secs+=(Math.max(1,Number(attr(event,'jakso'))||1)-1)*(Math.max(1,Number(text(match,'eramin'))||45))*60;
  }
  return Number.isFinite(secs)?secs:0;
 }
 function makeLogo(url,name){
  if(url&&/^https?:\/\//i.test(url)){
   const img=document.createElement('img');img.className='logo';img.alt='';img.src=url;img.onerror=()=>{const fallback=document.createElement('span');fallback.className='fallback';fallback.textContent=(name||'?').slice(0,2).toUpperCase();img.replaceWith(fallback)};return img;
  }
  const span=document.createElement('span');span.className='fallback';span.textContent=(name||'?').slice(0,2).toUpperCase();return span;
 }
 function addTeam(container,name,logo,reverse=false){
  container.className='team'+(reverse?' away':'');
  const nameEl=document.createElement('span');nameEl.className='team-name';nameEl.textContent=name;
  const image=makeLogo(logo,name);
  if(reverse)container.append(nameEl,image);else container.append(image,nameEl);
 }
 function renderScorers(match,homeId,awayId,homeName,awayName){
  const goals=[...match.getElementsByTagName('tapahtuma')].filter(e=>attr(e,'tapahtuma')==='maali').map(e=>({node:e,seconds:goalSeconds(e,match)})).sort((a,b)=>a.seconds-b.seconds);
  const home=[],away=[];
  for(const item of goals){
   const e=item.node;
   const teamId=attr(e,'joukkue');
   const side=attr(e,'kvjoukkue')||(teamId===homeId?'koti':teamId===awayId?'vieras':'');
   const player=attr(e,'pelaajanimi')||[attr(e,'etunimi'),attr(e,'sukunimi')].filter(Boolean).join(' ')||'Maalintekijä';
   const minute=minuteLabel(e,match);
   const note=/^rl$/i.test(attr(e,'selite'))?' RL':/^kl$/i.test(attr(e,'selite'))?' KL':'';
   const scorer={player,minute,note};
   if(side==='koti'||teamId===homeId)home.push(scorer);else if(side==='vieras'||teamId===awayId)away.push(scorer);
  }
  return {home,away};
 }
 function appendScorers(target,items){
  for(const scorer of items){
   const item=document.createElement('span');item.className='scorer';
   item.append(document.createTextNode(scorer.player));
   if(scorer.minute){const minute=document.createElement('strong');minute.className='scorer-minute';minute.textContent=scorer.minute;item.append(minute)}
   if(scorer.note){const note=document.createElement('small');note.textContent=' '+scorer.note.trim();note.style.color='#bdc7d0';item.append(note)}
   target.append(item);
  }
 }
 function matchCard(match,kickoffFromPage=''){
  const homeName=text(match,'kotinimi')||'KOTI',awayName=text(match,'vierasnimi')||'VIERAS';
  const homeId=text(match,'kotijoukkue'),awayId=text(match,'vierasjoukkue');
  const card=document.createElement('article');card.className='match';
  const head=document.createElement('div');head.className='match-head';
  const home=document.createElement('div');addTeam(home,homeName,text(match,'kotilogo'));
  const score=document.createElement('div');score.className='score';
  const hs=text(match,'kmaali'),as=text(match,'vmaali');
  const status=statusFor(match);
  const hasScore=hs!==''&&as!=='';
  const kickoff=status.phase==='upcoming'&&!hasScore?(kickoffFromPage||startTime(match)):'';
  if(kickoff){score.textContent=kickoff;score.classList.add('kickoff');score.setAttribute('aria-label','Ottelun alkamisaika '+kickoff)}
  else score.textContent=(hs!==''?hs:'–')+' – '+(as!==''?as:'–');
  const away=document.createElement('div');addTeam(away,awayName,text(match,'vieraslogo'),true);
  const state=document.createElement('div');state.className='state'+(status.live?' live':'');state.textContent=status.label;
  head.append(home,score,away,state);card.append(head);
  const scorerGroups=renderScorers(match,homeId,awayId,homeName,awayName);
  const scorerRow=document.createElement('div');scorerRow.className='scorers';
  const homeScorers=document.createElement('div');homeScorers.className='scorer-list';appendScorers(homeScorers,scorerGroups.home);
  const awayScorers=document.createElement('div');awayScorers.className='scorer-list away';appendScorers(awayScorers,scorerGroups.away);
  scorerRow.append(homeScorers,awayScorers);
  if(!scorerGroups.home.length&&!scorerGroups.away.length){const empty=document.createElement('div');empty.className='no-scorers';empty.textContent='Ei maalintekijöitä vielä';scorerRow.append(empty)}
  card.append(scorerRow);return card;
 }
 async function render(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.querySelector('parsererror'))throw new Error('TorneoPalin XML-vastausta ei voitu lukea.');
  const all=[...doc.getElementsByTagName('ottelu')];
  if(!all.length)throw new Error('Tälle päivälle ei löytynyt otteluita.');
  let selected=[];
  if(requestedIds.length){
   const byId=new Map(all.map(m=>[text(m,'otteluid'),m]));
   selected=requestedIds.map(id=>byId.get(id)).filter(Boolean);
   const missing=requestedIds.filter(id=>!byId.has(id));
   if(!selected.length)throw new Error('Annettuja ottelutunnuksia ei löytynyt tältä päivältä: '+requestedIds.join(', '));
   if(missing.length){const note=document.createElement('div');note.className='missing';note.textContent='Ottelutunnuksia ei löytynyt tältä päivältä: '+missing.join(', ');$('error').replaceChildren(note);$('error').classList.remove('hidden')}
   else $('error').classList.add('hidden');
  }else{selected=all;$('error').classList.add('hidden')}
  const kickoffEntries=await Promise.all(selected.map(async match=>{
   if(statusFor(match).phase!=='upcoming')return [text(match,'otteluid'),''];
   const id=text(match,'otteluid');if(!id)return [id,''];
   try{
    const url=new URL('/api/match-start',location.origin);
    url.searchParams.set('pvm',date);
    url.searchParams.set('koti',text(match,'kotinimi'));
    url.searchParams.set('vieras',text(match,'vierasnimi'));
    const response=await fetch(url.toString(),{cache:'no-store'});
    if(!response.ok)return [id,''];
    const data=await response.json();return [id,typeof data.klo==='string'?data.klo:''];
   }catch{return [id,''];}
  }));
  const kickoffById=new Map(kickoffEntries);
  $matches.replaceChildren(...selected.map(match=>matchCard(match,kickoffById.get(text(match,'otteluid'))||'')));
  const tournamentName=selected.map(m=>text(m,'turnausnimi')).find(Boolean)||tournament;
  $('headingMeta').textContent=dateLabel;
  $('tournamentLabel').textContent='BANDYLIVE · '+tournamentName;
  $('updated').textContent='PÄIVITETTY '+new Date().toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
 }
 function showError(message){$('error').textContent='TorneoPal: '+message;$('error').classList.remove('hidden')}
 async function refreshData(){
  const sequence=++requestSequence;
  try{
   const url=new URL('/api/live',location.origin);url.searchParams.set('pvm',date);url.searchParams.set('turnaus',tournament);
   const response=await fetch(q.get('api')||url.toString(),{cache:'no-store'});
   if(!response.ok)throw new Error('palvelin vastasi '+response.status);
   const xml=await response.text();
   const apply=async()=>{if(sequence<=lastRenderedSequence)return;lastRenderedSequence=sequence;try{await render(xml)}catch(error){showError(error.message||'Ottelutietoja ei voitu käsitellä.')}};
   if(delayMs>0)setTimeout(apply,delayMs);else apply();
  }catch(error){showError(error.message||'TorneoPal-yhteys epäonnistui.')}
 }
 refreshData();setInterval(refreshData,refresh*1000);
})();
</script>
</body>
</html>
